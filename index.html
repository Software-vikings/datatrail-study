e,\n       AVG(amount) AS average_order,\n       MIN(amount) AS smallest,\n       MAX(amount) AS largest\nFROM orders;","Why must you understand row grain before summing revenue after a join?",["A join can multiply rows and therefore inflate the sum","SUM only works with dates","Grain determines text case"],0,"One-to-many joins can duplicate a fact row. Aggregate at the intended grain or use a model/query design that prevents double-counting.","Describe the grain of the current orders table and explain what SUM(amount) returns.","One row in orders represents one order; sum across the selected orders.","Each orders row represents one order. SUM(amount) returns the total amount of those order records, subject to the query's filters."],["GROUP BY and HAVING","Intermediate",14,"GROUP BY creates summary rows. HAVING keeps only groups whose calculated metrics meet a condition.","GROUP BY partitions input rows into groups; HAVING is a predicate evaluated against grouped/aggregated results.","First calculate total revenue per customer, then keep customers whose total spend exceeds ₹5,000.","SELECT customer_id,\n       SUM(amount) AS total_spend\nFROM orders\nGROUP BY customer_id\nHAVING SUM(amount) > 5000;","What is the difference between WHERE and HAVING?",["WHERE filters input rows; HAVING filters groups","HAVING always runs first","They are synonyms"],0,"Use WHERE for row-level conditions and HAVING for conditions on aggregates or grouped values.","Return cities whose total order revenue exceeds ₹5,000.","Join customers to orders, group by city and filter the sum using HAVING.","SELECT c.city, SUM(o.amount) AS revenue FROM orders o JOIN customers c ON c.customer_id=o.customer_id GROUP BY c.city HAVING SUM(o.amount)>5000;"],["INNER JOIN: match related rows","Intermediate",14,"An INNER JOIN returns rows where the join condition finds a match on both sides.","A join combines rows from two relations according to a join predicate. INNER JOIN retains only matching row pairs.","Match each order to the customer who placed it using customer_id.","SELECT o.order_id, o.amount, c.name\nFROM orders AS o\nINNER JOIN customers AS c\n  ON o.customer_id = c.customer_id;","What is returned when an order has no matching customer?",["A row with NULL customer details","No row from that unmatched order","Every customer in the database"],1,"INNER JOIN removes nonmatching rows from either side. Check key quality and referential integrity when records disappear unexpectedly.","Show each order ID with the matching customer name.","Join orders to customers on customer_id and select both requested fields.","SELECT o.order_id, c.name FROM orders o INNER JOIN customers c ON o.customer_id=c.customer_id;"],["LEFT JOIN: preserve the left table","Intermediate",14,"LEFT JOIN keeps every row from the left table. If no right-side record matches, the right-side columns are NULL.","A left outer join returns matched pairs plus one NULL-extended row for every unmatched left-side row.","Keep all customers in a customer report, including people who have never placed an order.","SELECT c.name, o.order_id\nFROM customers AS c\nLEFT JOIN orders AS o\n  ON o.customer_id = c.customer_id;","Which join keeps a customer even when they have no order?",["INNER JOIN","LEFT JOIN","CROSS JOIN"],1,"LEFT JOIN preserves every left-side customer row. An INNER JOIN would drop customers without orders.","Find customers who have never placed an order.","LEFT JOIN customers to orders, then filter where orders.order_id IS NULL.","SELECT c.customer_id, c.name FROM customers c LEFT JOIN orders o ON o.customer_id=c.customer_id WHERE o.order_id IS NULL;"],["CTEs: name a query step","Intermediate",13,"A common table expression gives a temporary name to a query result. It can make multi-step analysis easier to read.","A CTE is a named temporary result set introduced with WITH and scoped to a single SQL statement.","Think of a CTE as a labelled working sheet: calculate one summary, then use it in the next step.","WITH customer_spend AS (\n  SELECT customer_id, SUM(amount) AS spend\n  FROM orders\n  GROUP BY customer_id\n)\nSELECT * FROM customer_spend\nWHERE spend > 5000;","What keyword begins a common table expression?",["WITH","DEFINE","TEMP"],0,"WITH names a subquery that can be referenced by the main query. It does not permanently create a table.","Create a CTE for monthly order revenue, then select months with revenue above a threshold.","Use WITH monthly AS (...), then SELECT from monthly with a WHERE or HAVING as appropriate.","WITH monthly AS (SELECT strftime('%Y-%m',order_date) AS month, SUM(amount) AS revenue FROM orders GROUP BY strftime('%Y-%m',order_date)) SELECT * FROM monthly WHERE revenue>5000;"],["Window functions: rank without collapsing rows","Intermediate",15,"Window functions calculate across related rows but keep the original rows visible. GROUP BY would collapse them into summaries.","A window function evaluates an expression over a partition of the query result and returns a value for each row.","To rank orders by value, keep one row per order and add a rank column beside it.","SELECT order_id, amount,\n       ROW_NUMBER() OVER(ORDER BY amount DESC) AS row_num,\n       RANK() OVER(ORDER BY amount DESC) AS value_rank\nFROM orders;","What is the key difference between GROUP BY and a window function?",["GROUP BY reduces rows; a window function retains row-level detail","Window functions always delete duplicates","GROUP BY can never use SUM"],0,"Window results are attached to rows. Grouped aggregates return one row per group.","Rank orders from highest amount to lowest while retaining every order row.","Use RANK() OVER (ORDER BY amount DESC).","SELECT order_id, amount, RANK() OVER(ORDER BY amount DESC) AS value_rank FROM orders;"]],"excelCore":[["Excel Tables and structured references","Beginner",10,"Convert a clean range into an Excel Table. Tables expand as data is added and let formulas refer to column names.","Excel Tables are structured data regions with named columns, automatic expansion and structured references.","A table is like a growing register: add a new invoice at the bottom and the table's formulas and formatting extend.","Select the data → Insert → Table\n\n=[@Quantity]*[@UnitPrice]","What does a structured reference such as [@Quantity] refer to?",["The Quantity value on the current table row","The entire workbook","A cell named Quantity on another sheet"],0,"Structured references use table and column names, which can make formulas easier to understand.","Write a table formula for line revenue using Quantity and UnitPrice.","Use the current-row reference for both named columns.","=[@Quantity]*[@UnitPrice]"],["COUNT, COUNTA and COUNTBLANK","Beginner",9,"COUNT counts numeric cells, COUNTA counts non-empty cells, and COUNTBLANK counts empty cells.","These functions differ in how they classify cell contents and are useful for profiling spreadsheet completeness.","To audit a customer register, count numeric ages, filled customer names and blank email cells separately.","=COUNT(C2:C100)\n=COUNTA(A2:A100)\n=COUNTBLANK(D2:D100)","Which function counts cells that are not empty?",["COUNT","COUNTA","COUNTBLANK"],1,"COUNTA counts non-empty cells, including text. COUNT focuses on numeric values.","Count the number of non-empty invoice IDs in A2:A50.","Use COUNTA on the invoice ID range.","=COUNTA(A2:A50)"],["SUMIF and COUNTIF","Beginner",10,"SUMIF adds values that match one condition. COUNTIF counts cells that match one condition.","SUMIF applies a criterion to a range and sums corresponding values; COUNTIF counts cells satisfying a criterion.","Ask for the total sales in Chennai or the number of invoices marked Paid.","=SUMIF(B2:B20,\"Chennai\",C2:C20)\n=COUNTIF(D2:D20,\"Paid\")","Which function totals values matching one criterion?",["COUNTIF","SUMIF","COUNTA"],1,"SUMIF returns a sum for matching rows. COUNTIF returns a count, not a total amount.","Calculate total Revenue for Chennai from City in B and Revenue in C.","Use B as the criteria range and C as the sum range.","=SUMIF(B2:B20,\"Chennai\",C2:C20)"],["Clean text with TRIM, CLEAN and SUBSTITUTE","Intermediate",11,"Imported spreadsheet data may contain extra spaces or unwanted characters. Text-cleaning functions standardise it before lookups and grouping.","TRIM removes excess spaces, CLEAN removes nonprinting characters, and SUBSTITUTE replaces specified text.","Two spellings that look the same may not match because one includes a hidden space or line break.","=TRIM(A2)\n=CLEAN(A2)\n=SUBSTITUTE(A2,\"Ltd.\",\"\")","Which function removes extra spaces between words and at the edges?",["TRIM","SUM","ROUND"],0,"TRIM removes leading/trailing spaces and reduces repeated internal spaces to single spaces.","Clean the customer name in A2 by removing nonprinting characters and trimming spaces.","Apply CLEAN first and TRIM around its result.","=TRIM(CLEAN(A2))"],["Dates: TODAY, YEAR, MONTH and EOMONTH","Intermediate",11,"Dates should be stored as dates, not arbitrary text. Date functions help group records into months, quarters and years.","Excel stores dates as serial values; date functions extract calendar parts or calculate period boundaries.","To report a month-end balance, use EOMONTH rather than typing the last day manually.","=YEAR(A2)\n=MONTH(A2)\n=EOMONTH(A2,0)","What does EOMONTH(A2,0) return?",["The first day of the month","The last day of A2's month","The date one year later"],1,"EOMONTH returns the final day of the month a specified number of months before or after the start date.","Return the last day of the month containing date in A2.","Use EOMONTH with a month offset of zero.","=EOMONTH(A2,0)"],["IFERROR and lookup fallbacks","Intermediate",11,"Lookups can fail when a key is missing. IFERROR or XLOOKUP's not-found argument lets you display a clear fallback.","IFERROR evaluates a formula and returns an alternative when the formula results in an error; XLOOKUP supports an explicit if_not_found argument.","A report should say 'Not found' rather than showing an unexplained #N/A beside a customer.","=XLOOKUP(A2,Customers[ID],Customers[Name],\"Not found\")\n=IFERROR(VLOOKUP(A2,Table,2,FALSE),\"Not found\")","What is a safe reason to use a lookup fallback?",["To hide every data-quality issue without review","To make missing matches visible with a clear label","To change a missing ID into zero"],1,"A fallback improves readability, but analysts should still investigate missing keys rather than silently ignore them.","Look up a customer name by ID and display Not found when there is no match.","Use XLOOKUP's fourth argument for if_not_found.","=XLOOKUP(A2,Customers[ID],Customers[Name],\"Not found\")"],["Conditional formatting and data validation","Intermediate",10,"Conditional formatting highlights values based on rules. Data validation controls what a person can enter into a cell.","Conditional formatting applies visual formatting from evaluated conditions; data validation constrains or guides permitted input values.","Colour unusually high expenses for review, and use a dropdown to keep department names consistent.","Conditional formatting: Revenue > 5000\nData validation: list = Paid, Pending, Refunded","Which feature can restrict a cell to a dropdown list of approved statuses?",["Conditional formatting","Data validation","Freeze Panes"],1,"Data validation constrains input. Conditional formatting changes appearance based on a rule.","Design a simple data-quality control for a Status column that should only accept Paid, Pending or Refunded.","Use Data Validation with a List source containing the three accepted values.","Select the Status cells → Data → Data Validation → Allow: List → Source: Paid,Pending,Refunded."],["PivotTable thinking: dimensions and measures","Intermediate",12,"A PivotTable organises data by categories and calculates summaries. Put descriptive fields in Rows/Columns and numeric measures in Values.","A PivotTable aggregates structured records across categorical dimensions using measures such as sum, count and average.","To compare city revenue by month, City and Month are dimensions; Revenue is the measure.","Rows: City\nColumns: Month\nValues: Sum of Revenue\nFilters: Status","Where should Revenue normally go when building a sales summary?",["Values","Rows only","Report title"],0,"Revenue is a numeric measure to aggregate. City and Month are dimensions used to group it.","Design a PivotTable showing order count by city and status.","Place City in Rows, Status in Columns and OrderID in Values summarized by Count.","Rows = City; Columns = Status; Values = Count of OrderID."]],"pythonCore":[["Arithmetic, comparison and assignment","Beginner",9,"Python can calculate with numbers and compare values. A single equals sign assigns; comparison operators test a relationship.","Expressions combine values and operators. Assignment binds a name to a value; comparison expressions return booleans.","A finance calculation might calculate gross margin, then check whether it meets a target.","revenue = 15000\ncost = 8400\nprofit = revenue - cost\nmeets_target = profit >= 6000\nprint(profit, meets_target)","What does `profit >= 6000` produce?",["A boolean True or False","A new variable name","A text string"],0,"Comparison operators return boolean values. They can be used in IF conditions and filters.","Calculate profit from revenue=18000 and cost=11200, then check if profit is at least 6000.","Subtract cost from revenue, then use >= to compare with 6000.","revenue = 18000\ncost = 11200\nprofit = revenue - cost\nprint(profit >= 6000)"],["Strings and f-strings","Beginner",10,"Strings store text. f-strings insert the value of a variable into a readable message.","An f-string is a string literal prefixed by f that evaluates expressions inside curly braces.","Instead of printing a label and number separately, build one message that reads naturally.","city = \"Chennai\"\nrevenue = 12500\nprint(f\"Revenue in {city}: ₹{revenue:,}\")","What character tells Python that a string is an f-string?",["f before the opening quote","$ after the quote","The colon in the text"],0,"Prefix the string literal with f. Expressions inside braces are evaluated and inserted.","Create an f-string that says `Asha placed 3 orders` using name and order_count variables.","Put the variable names inside curly braces after an f prefix.","name = \"Asha\"\norder_count = 3\nprint(f\"{name} placed {order_count} orders\")"],["Booleans and logical conditions","Beginner",10,"Boolean values are True and False. Use and, or and not to combine conditions.","Python's Boolean operators evaluate truth values, with and/or short-circuiting according to Python's truth-value rules.","A discount might apply when a customer is a member and the bill is above ₹2,000.","member = True\namount = 2400\neligible = member and amount >= 2000\nprint(eligible)","When is `A and B` true?",["Only when both A and B are true","When either one is true","Only when A is false"],0,"AND requires both sides to be true. OR requires at least one side to be true.","Write a condition that is true when city is Chennai or Pune and sales exceed 1000.","Put the city comparison in parentheses and join it with and sales > 1000.","eligible = (city == \"Chennai\" or city == \"Pune\") and sales > 1000"],["if, elif and else","Beginner",11,"Use if to choose what should happen. Add elif for another condition and else for the fallback.","Conditional statements provide branch-based control flow. Only the first true branch in an if/elif chain executes.","A business can label an invoice overdue, due soon or not due based on its days overdue.","days_overdue = 12\nif days_overdue > 30:\n    band = \"Critical\"\nelif days_overdue > 0:\n    band = \"Overdue\"\nelse:\n    band = \"Current\"","Which branch runs when the first if is false and the elif condition is true?",["Both if and elif","Only the elif branch","The else branch"],1,"Python tests branches in order and executes the first branch whose condition is true.","Classify score as High at 80+, Medium at 50+, and Low otherwise.","Check the highest threshold first, then the next threshold.","if score >= 80:\n    band = \"High\"\nelif score >= 50:\n    band = \"Medium\"\nelse:\n    band = \"Low\""],["for loops and range","Beginner",11,"A for loop repeats instructions for each item. range() generates a sequence of integers useful for repeating a known number of times.","A for statement iterates over an iterable, binding each item to the loop target in sequence.","Loop through invoice amounts and add each to a running total rather than writing one addition per invoice.","amounts = [1200, 900, 1500]\ntotal = 0\nfor amount in amounts:\n    total += amount\nprint(total)","What does `range(3)` produce when used in a for loop?",["0, 1, 2","1, 2, 3","0, 1, 2, 3"],0,"range(3) yields 0, 1 and 2. The stop value is excluded.","Use a loop to add all values in [100, 200, 300] to a total.","Start total at zero and add each value inside the loop.","total = 0\nfor value in [100, 200, 300]:\n    total += value\nprint(total)"],["enumerate and zip","Intermediate",10,"enumerate gives you both an item's position and value. zip lets you loop over two related sequences together.","enumerate returns pairs of index and value; zip iterates over corresponding elements from multiple iterables.","Match each sales amount with its city rather than relying on separate manual position lookups.","cities = [\"Chennai\", \"Pune\"]\nsales = [1200, 900]\nfor city, amount in zip(cities, sales):\n    print(city, amount)","What does zip(cities, sales) pair together?",["The first city with the first sale, second with second, and so on","Every possible city-sale combination","Only the last values"],0,"zip pairs items by position and stops at the shortest iterable by default.","Print each expense with its numbered position starting at 1.","Use enumerate(expenses, start=1).","for position, expense in enumerate(expenses, start=1):\n    print(position, expense)"],["Dictionaries for business records","Intermediate",11,"A dictionary stores values under named keys. It is useful for one record or for grouping totals by category.","A Python dict is a mutable mapping from hashable keys to values, with unique keys.","One invoice can store fields such as invoice_id, city and amount. A city-to-total dictionary can store aggregated sales.","invoice = {\"invoice_id\": 1001, \"city\": \"Chennai\", \"amount\": 1200}\nprint(invoice[\"amount\"])\n\nsales_by_city = {\"Chennai\": 1200, \"Pune\": 900}","What does `invoice['city']` access?",["The value stored under the city key","The third dictionary item by position","The dictionary's filename"],0,"Dictionary keys provide named access. Use .get() when a key might be absent.","Build a dictionary of sales by city, adding 500 to Chennai and 700 to Pune.","Use `totals[city] = totals.get(city, 0) + amount` for repeated categories.","totals = {}\nfor city, amount in [(\"Chennai\",500),(\"Pune\",700)]:\n    totals[city] = totals.get(city, 0) + amount\nprint(totals)"],["Functions: parameters, return and reuse","Intermediate",12,"A function packages a repeatable task. Parameters are inputs, and return sends a result back to the caller.","Function definitions bind a callable object. Return exits the function and supplies a value; print displays output but does not return it.","A tax calculation should be a function so the same rule can be reused for every invoice.","def net_amount(gross, discount):\n    return gross - discount\n\nresult = net_amount(1000, 100)\nprint(result)","What is the main difference between return and print?",["return gives a value to the caller; print displays text","They are the same","print sends a value back to a function caller"],0,"Use return when later code must use the calculated result. Use print when you only need to display it.","Write a function named profit that returns revenue minus cost.","Define the function with two parameters and return the subtraction.","def profit(revenue, cost):\n    return revenue - cost"]],"pandasCore":[["Inspect a DataFrame before changing it","Beginner",10,"Before cleaning data, inspect its first rows, dimensions, types, missing values and numeric summaries.","Data profiling describes a dataset's structure and quality before transformation; pandas provides head, shape, info, describe and isna.","Before editing a ledger, check how many rows it has, which columns exist and whether amounts are stored as numbers.","df.head()\ndf.shape\ndf.info()\ndf.describe(include=\"all\")\ndf.isna().sum()","Which command reports column types and non-null counts?",["df.head()","df.info()","df.tail()"],1,"info() reports DataFrame structure, column types and non-null counts.","Write a short inspection sequence for a DataFrame called orders.","Preview the first rows, check dimensions, inspect dtypes and count missing values.","orders.head()\norders.shape\norders.info()\norders.isna().sum()"],["Select rows with loc and iloc","Beginner",11,"loc selects by labels and Boolean conditions. iloc selects by integer position.","DataFrame.loc is label-based indexing; DataFrame.iloc is integer-position-based indexing.","loc is like finding a customer by a named ID. iloc is like selecting the third row by its position.","df.loc[df[\"city\"] == \"Chennai\", [\"order_id\", \"amount\"]]\ndf.iloc[0:5, 0:3]","Which accessor selects by integer position?",["loc","iloc","groupby"],1,"iloc uses integer positions. loc uses labels and Boolean masks.","Select rows where amount exceeds 2,000 and return order_id and amount.","Use loc with a Boolean condition and a list of columns.","df.loc[df[\"amount\"] > 2000, [\"order_id\", \"amount\"]]"],["Filter with Boolean masks","Beginner",11,"Boolean masks select rows that meet conditions. Combine masks with &, | and ~, and wrap each comparison in parentheses.","Boolean indexing uses an aligned Boolean Series to select rows from a DataFrame.","Create a yes/no test for every order, then keep only the rows whose test is True.","paid_large = df[(df[\"status\"] == \"Paid\") & (df[\"amount\"] >= 2000)]","Why are parentheses important in a pandas Boolean mask?",["They make comparison grouping and operator precedence explicit","They turn numbers into strings","They sort the rows"],0,"Use parentheses around each comparison before combining Series with &, | or ~.","Filter orders that are either Paid or Pending and have amount above 1,000.","Combine the status condition in parentheses with the amount condition using &.","df[((df[\"status\"] == \"Paid\") | (df[\"status\"] == \"Pending\")) & (df[\"amount\"] > 1000)]"],["Sort, rank and count categories","Intermediate",11,"Sort records to inspect extremes. Use value_counts to count categories and rank to compare values within a column.","sort_values orders rows by column values; Series.value_counts computes category frequencies; rank assigns relative ranks.","Sort orders from highest amount to lowest, or count how often each payment status appears.","df.sort_values(\"amount\", ascending=False)\ndf[\"status\"].value_counts(dropna=False)\ndf[\"amount\"].rank(method=\"dense\", ascending=False)","Which method counts how many rows belong to each status?",["value_counts()","describe()","reset_index()"],0,"value_counts returns the frequency of each distinct value. dropna=False includes missing values in the count.","Return the five largest orders and include missing statuses in a status frequency table.","Use sort_values with ascending=False and value_counts with dropna=False.","largest = df.sort_values(\"amount\", ascending=False).head(5)\nstatus_counts = df[\"status\"].value_counts(dropna=False)"],["Change data types deliberately","Intermediate",12,"Imported numbers may be stored as text and dates may be strings. Convert types deliberately before calculations.","pandas dtype conversion uses astype, to_numeric and to_datetime; conversion errors should be handled explicitly.","A revenue column containing the text '1,200' is not ready for numeric aggregation until it is converted.","df[\"amount\"] = pd.to_numeric(df[\"amount\"], errors=\"coerce\")\ndf[\"order_date\"] = pd.to_datetime(df[\"order_date\"], errors=\"coerce\")","What does errors='coerce' do for an invalid numeric value?",["Raises an error immediately","Converts invalid values to missing values (NaN)","Converts it to zero"],1,"Coercion makes failures visible as missing values. Count and investigate them before deciding how to handle them.","Convert amount to numeric and order_date to datetime, then count conversion failures.","Use to_numeric/to_datetime with errors='coerce', then check isna().sum().","df[\"amount\"] = pd.to_numeric(df[\"amount\"], errors=\"coerce\")\ndf[\"order_date\"] = pd.to_datetime(df[\"order_date\"], errors=\"coerce\")\nprint(df[[\"amount\", \"order_date\"]].isna().sum())"],["Create derived columns with assign","Intermediate",10,"assign creates new columns from existing ones. Prefer vectorised column calculations over slow row-by-row loops.","DataFrame.assign returns a new DataFrame with the supplied columns added or replaced; vectorised operations apply across Series.","Calculate tax for every order in one expression rather than looping through each invoice.","df = df.assign(tax=df[\"amount\"] * 0.18,\n               gross=df[\"amount\"] * 1.18)","What is a benefit of vectorised pandas column operations?",["They operate across an entire Series without a Python loop per row","They always remove missing values","They turn every value into text"],0,"Vectorised expressions are concise and usually more efficient than iterating through rows in Python.","Create a tax_amount column equal to 18% of amount.","Use assign and multiply the amount Series by 0.18.","df = df.assign(tax_amount=df[\"amount\"] * 0.18)"],["Rename columns and reset an index","Beginner",9,"Clear column names make code easier to understand. Reset an index when you need the row labels returned as a regular column or a fresh integer index.","rename changes axis labels; reset_index moves index levels into columns and optionally creates a default integer index.","After a grouped summary, you may want city back as a normal column before exporting or merging.","summary = df.groupby(\"city\")[\"amount\"].sum()\nsummary = summary.rename(\"revenue\").reset_index()","What does reset_index() do by default?",["Deletes all rows","Turns index labels into columns and creates a new default index","Sorts every column alphabetically"],1,"reset_index moves the old index into columns by default and creates a RangeIndex.","Rename the amount column to revenue_amount and reset the index of a grouped result.","Use rename with a columns dictionary; call reset_index on the grouped object.","df = df.rename(columns={\"amount\": \"revenue_amount\"})\nsummary = df.groupby(\"city\")[\"revenue_amount\"].sum().reset_index()"],["Export clean results to CSV","Beginner",9,"After cleaning or summarising, export a reproducible result. Choose whether to include the DataFrame index.","DataFrame.to_csv serialises tabular data to delimited text; index=False avoids writing the DataFrame index as an extra column.","An exported file should contain the intended business fields, not an accidental extra index column.","clean_orders.to_csv(\"clean_orders.csv\", index=False)","Why is index=False commonly used when exporting a clean CSV?",["It avoids writing the DataFrame index as an extra column","It deletes the first record","It sorts the file"],0,"The index is often only a pandas row label, not a business field. Include it only when you intentionally need it.","Export a DataFrame called monthly_sales to monthly_sales.csv without the index.","Call to_csv with the path and index=False.","monthly_sales.to_csv(\"monthly_sales.csv\", index=False)"]],"numpyCore":[["Create arrays with zeros, ones and arange","Beginner",10,"NumPy provides functions for common array patterns: zeros, ones, arange and linspace.","Array-construction routines allocate ndarrays with defined shapes or generated sequences.","Create a blank matrix for a simulation or a sequence of monthly periods without writing every value manually.","np.zeros((2, 3))\nnp.ones(4)\nnp.arange(0, 10, 2)\nnp.linspace(0, 1, 5)","What does np.arange(0, 10, 2) return?",["0, 2, 4, 6, 8","0, 2, 4, 6, 8, 10","2, 4, 6, 8, 10"],0,"arange includes the start but excludes the stop value. The step controls the interval.","Create an array of even values from 2 up to but not including 12.","Use arange with start 2, stop 12 and step 2.","np.arange(2, 12, 2)"],["Understand shape and reshape","Beginner",10,"Shape describes how many elements sit along each axis. Reshape changes the arrangement without changing the total number of elements.","ndarray.shape is a tuple of axis lengths. reshape returns an array with a compatible shape and the same element count.","A list of 12 monthly numbers can be arranged as 3 years by 4 quarters if the total element count stays 12.","values = np.arange(12)\nquarters = values.reshape(3, 4)\nprint(quarters.shape)  # (3, 4)","Can an array with 12 elements be reshaped to (2, 5)?",["Yes","No, because the element counts differ"],1,"Reshape requires the product of the new dimensions to equal the original number of elements.","Reshape 24 values into 4 rows and 6 columns.","Create 24 values, then call reshape(4, 6).","np.arange(24).reshape(4, 6)"],["Index 2D arrays by row and column","Beginner",11,"For a 2D NumPy array, provide the row index first and the column index second. Slices can select whole rows or columns.","Multidimensional ndarray indexing accepts one index expression per axis; slices select ranges along each axis.","Imagine a report where rows are cities and columns are quarters. Use row and column positions to select a specific result.","sales = np.array([[100, 120], [90, 140], [110, 150]])\nsales[1, 0]   # second row, first column\nsales[:, 1]   # every row, second column","What does sales[:, 1] select?",["Every row from the second column","Only the second row","The first column"],0,"The colon selects all row positions; index 1 selects the second column.","Select all rows for the first column of a 2D array called data.","Use a colon for rows and index 0 for the first column.","data[:, 0]"],["Broadcasting rules","Intermediate",12,"Broadcasting allows arrays with compatible shapes to work together without manually copying values.","NumPy compares shapes from the trailing dimensions; dimensions are compatible when equal or one of them is 1.","Apply a tax rate to every row of a sales matrix when each column has its own rate.","prices = np.array([[100, 200], [300, 400]])\ntax = np.array([0.05, 0.10])\ngross = prices * (1 + tax)","Why can shape (2, 3) combine with shape (3,)?",["The trailing dimension lengths match","Both arrays have the same total size","NumPy ignores shape"],0,"Broadcasting aligns trailing dimensions. The length-3 vector is applied across each row of the (2, 3) matrix.","Explain whether shapes (4, 3) and (4,) are compatible for element-wise addition.","Compare from the right: 3 and 4 differ and neither is 1.","They are not compatible for direct element-wise broadcasting because trailing dimensions 3 and 4 differ. Reshape the vector to (4,1) if you intend row-wise values."],["Aggregate by axis","Intermediate",12,"An axis tells NumPy which direction to reduce. On a 2D array, axis=0 reduces rows and leaves one result per column; axis=1 reduces columns and leaves one result per row.","Reduction functions collapse one or more axes. The remaining axes determine the shape of the output.","To total each month's sales across stores, sum down the store rows. To total each store across months, sum across columns.","sales = np.array([[100, 120, 130], [90, 140, 150]])\nby_month = sales.sum(axis=0)\nby_store = sales.sum(axis=1)","What shape does sales.sum(axis=0) have when sales.shape is (2, 3)?",["(2,)","(3,)","(2, 3)"],1,"Reducing axis 0 collapses the two rows and leaves the three columns, so the result has shape (3,).","Calculate total of each column of a 5-by-4 matrix.","Use sum(axis=0).","matrix.sum(axis=0)"],["Boolean masks and np.where","Intermediate",11,"Compare an array with a condition to create a True/False mask. Use the mask to select or label values.","Boolean indexing selects positions whose mask entries are true; np.where performs element-wise conditional selection.","Flag every transaction above a limit without writing one if-statement per record.","amounts = np.array([500, 1200, 900])\nlarge = amounts[amounts >= 1000]\nlabels = np.where(amounts >= 1000, \"Large\", \"Regular\")","What does amounts[amounts >= 1000] return?",["Only values that meet the condition","The Boolean mask only","The positions of values"],0,"Boolean indexing returns values at positions where the condition is True.","Select sales values greater than 1500 from an array named sales.","Place the comparison inside square brackets after the array name.","sales[sales > 1500]"],["Missing numeric values: NaN and finite checks","Intermediate",11,"NaN represents a missing or undefined numerical value in many NumPy workflows. Ordinary equality checks do not detect NaN reliably.","np.isnan detects NaN; np.isfinite identifies values that are neither NaN nor positive/negative infinity.","Before calculating average revenue, identify missing and invalid values rather than letting them silently distort results.","values = np.array([100.0, np.nan, 150.0])\nmissing = np.isnan(values)\nvalid = values[np.isfinite(values)]\nprint(valid.mean())","Which expression identifies NaN values?",["values == np.nan","np.isnan(values)","np.isfinite(values)"],1,"Use np.isnan. NaN is not equal to itself, so equality comparison is not a reliable missing-value test.","Create a mask for valid finite values in an array called readings.","Use np.isfinite(readings).","valid_mask = np.isfinite(readings)"],["Combine arrays with concatenate and stack","Intermediate",12,"Concatenate joins arrays along an existing axis. Stack creates a new axis and requires compatible input shapes.","np.concatenate joins along an existing axis; np.stack inserts a new axis at a specified position.","Append next month's sales rows to the existing dataset, or stack daily series into a new dimension for comparison.","a = np.array([1, 2])\nb = np.array([3, 4])\nnp.concatenate([a, b])\nnp.stack([a, b])","What does np.stack([a, b]) do for two 1D arrays of length 2?",["Creates a 2D array with a new axis","Always flattens them into a 1D array","Removes repeated values"],0,"Stack inserts a new axis, while concatenate joins along an existing axis.","Join two daily sales arrays end-to-end.","Use concatenate with a list containing both arrays.","np.concatenate([day_one, day_two])"]],"statisticsCore":[["Levels of measurement and variable roles","Beginner",10,"Variables can be categories or numbers. Categories can be nominal or ordered; numerical measures can be interval or ratio.","Measurement scales describe the mathematical properties of variable values and influence which summaries and methods are meaningful.","Customer segment is a label, satisfaction rating is ordered, temperature in Celsius has no true zero, and revenue has a meaningful zero.","Nominal: city\nOrdinal: satisfaction level\nInterval: temperature °C\nRatio: revenue ₹","Which variable has a meaningful zero and supports ratio statements?",["City","Satisfaction rating","Revenue"],2,"Revenue is ratio-scale: zero means none, and ₹2,000 is twice ₹1,000 in amount.","Classify payment method, satisfaction rank and monthly revenue by measurement type.","Ask whether the value is a label, ordered label, interval measure or ratio measure.","Payment method is nominal; satisfaction rank is ordinal; monthly revenue is ratio-scale."],["Frequency tables and distributions","Beginner",10,"A frequency table counts how often each value or category occurs. A distribution shows how observations are spread.","A frequency distribution summarises observations by category or interval, using counts, proportions or densities.","Instead of scanning a thousand order values, count how many are Small, Medium and Large.","Order band | Count\nSmall | 12\nMedium | 8\nLarge | 5","What does relative frequency represent?",["A category count divided by the total count","The largest value","A standard deviation"],0,"Relative frequency expresses a count as a share of all observations, often shown as a percentage.","Describe how you would build a frequency table of orders by status.","Count records in each status category, then divide by total orders for proportions.","Count Paid, Pending and Refunded orders. Divide each count by the total number of orders to calculate each category's relative frequency."],["Histograms, skew and distribution shape","Intermediate",11,"A histogram groups numerical values into intervals. Its shape helps you see concentration, spread, gaps and skew.","A histogram estimates a distribution by binning numerical observations; skewness describes asymmetry in the distribution.","A few very large orders can stretch the distribution to the right, making the mean larger than the median.","Right-skewed example:\n100, 120, 130, 150, 900\nMean = 280\nMedian = 130","What does a long right tail usually indicate?",["A few unusually high values","Every value is identical","Most values are negative"],0,"A right tail extends toward larger values. It often means a small number of high observations pull the mean upward.","Given a right-skewed order amount distribution, choose a robust measure of centre and explain why.","Compare the impact of one extreme value on mean and median.","The median is usually more robust to a few extreme high values than the mean."],["Percentiles, quartiles and IQR","Intermediate",11,"Percentiles show the position below which a share of observations falls. The interquartile range measures the spread of the middle half.","Quantiles partition an ordered distribution; IQR is Q3 minus Q1 and is robust to extreme values.","The 75th percentile marks a value at or below which roughly 75% of observations lie, under the chosen quantile convention.","Q1 = 100\nMedian = 140\nQ3 = 220\nIQR = Q3 - Q1 = 120","What does the IQR measure?",["Spread of the middle 50% of observations","Difference between maximum and minimum only","The arithmetic mean"],0,"IQR = Q3 − Q1. It describes the central spread and is less affected by outliers than the range.","Calculate the IQR when Q1=80 and Q3=170.","Subtract the first quartile from the third.","IQR = 170 - 80 = 90."],["Z-scores and standardisation","Intermediate",11,"A z-score tells how many standard deviations a value is above or below the mean.","A z-score is (observation − mean) / standard deviation, expressing a value in standard-deviation units.","Compare exam scores from two classes with different averages and spreads by converting them to standard-deviation units.","z = (x - μ) / σ\n\nIf x=85, μ=70 and σ=10,\nz = 1.5","What does z = -2 mean?",["Two standard deviations below the mean","Two units below zero","Two standard deviations above the mean"],0,"A negative z-score is below the mean; its magnitude gives the number of standard deviations.","Calculate the z-score for x=90, mean=75 and standard deviation=5.","Subtract the mean, then divide by the standard deviation.","z = (90 - 75) / 5 = 3."],["Sampling variability and standard error","Intermediate",12,"A sample statistic changes from sample to sample. Standard error describes the variability of an estimator across repeated samples.","Standard error is the standard deviation of the sampling distribution of a statistic; for a sample mean under standard assumptions, SE = s/√n.","One group of 100 customers may spend slightly differently from another group of 100 customers selected from the same population.","SE(mean) ≈ sample standard deviation / √sample size\n\ns=20, n=100 → SE=2","What usually happens to the standard error of a mean when sample size grows, all else equal?",["It decreases","It increases","It must become zero"],0,"SE decreases approximately with the square root of sample size. It does not become zero just because n is large.","Calculate the approximate standard error when sample SD is 30 and n is 100.","Divide 30 by the square root of 100.","SE = 30 / 10 = 3."],["Confidence intervals: estimate and uncertainty","Intermediate",12,"A confidence interval gives a range produced by a method with a stated long-run coverage rate. It communicates uncertainty around an estimate.","A frequentist confidence procedure has long-run coverage under repeated sampling and model assumptions; it is not a probability statement about a fixed parameter after observing the interval.","An estimate of average monthly spend is more informative when paired with an uncertainty range than when shown alone.","Estimate ± critical value × standard error\n\nExample: 500 ± 1.96 × 10 = [480.4, 519.6]","What does a 95% confidence procedure mean in repeated sampling?",["About 95% of intervals constructed by the procedure would cover the true parameter","There is a 95% probability the fixed parameter is inside this one interval","95% of sample values are inside the interval"],0,"The 95% refers to the long-run coverage of the procedure under its assumptions.","Explain a 95% confidence interval without saying 'there is a 95% chance the true value is here'.","Talk about repeating the sampling and interval-construction process.","If we repeatedly drew samples and built intervals with the same valid method, about 95% of those intervals would contain the fixed population parameter."],["The hypothesis-testing workflow","Intermediate",12,"A hypothesis test starts with a question, defines a null and alternative hypothesis, selects a test, checks assumptions and interprets evidence.","NHST evaluates sample data under a null model, using a test statistic and a pre-specified significance threshold.","Decide what 'no difference' means before looking at the result; otherwise you risk choosing a test to justify the outcome you wanted.","H0: mean order value is equal in two regions\nH1: mean order value differs\nα = 0.05","What should be defined before inspecting the final p-value?",["The hypotheses, outcome and analysis plan","Only the desired conclusion","The chart colour"],0,"Pre-specifying hypotheses and the analysis plan reduces selective reporting and p-hacking risk.","Write a null and alternative hypothesis for whether the average order value differs between two regions.","Define the population quantity and whether your alternative is one-sided or two-sided.","H0: the population mean order values are equal between the two regions. H1: the population mean order values differ between the regions (two-sided)."]],"powerbiCore":[["Power BI Desktop: orient yourself","Beginner",10,"Power BI Desktop is the authoring tool used to connect data, transform it, build a model and create report pages. The browser course can teach the concepts, but Desktop is where you practise the full workflow.","Power BI Desktop is a Windows application supporting data acquisition, Power Query transformations, semantic modelling, DAX and report authoring.","Think of the workflow as a small factory: import raw materials, prepare them, connect the model, then design the report.","Home / Get Data → Transform Data → Model view → Report view","Which Power BI Desktop view is primarily used to create visuals and report pages?",["Report view","Model view","Power Query Editor"],0,"Report view is where visuals and report pages are authored. Model view manages relationships; Power Query Editor transforms data.","Open Power BI Desktop and locate Report view, Data view and Model view.","Identify the three views and write one task performed in each.","Report view: build visuals. Data view: inspect loaded tables. Model view: create and inspect relationships."],["Connect to an Excel or CSV source","Beginner",11,"Power BI can import data from files and databases. Choose the source, inspect the preview and select whether to load or transform the data.","Power BI Get Data connectors establish source connections and expose import or supported live/connectivity modes.","Before designing a report, bring the sales file into the model and verify that the expected tables and columns arrived.","Home → Get Data → Excel / Text-CSV\nPreview → Transform Data or Load","What should you do before loading an unfamiliar data file?",["Inspect the preview, headers and data types","Build all visuals immediately","Delete columns at random"],0,"Previewing helps identify incorrect headers, data types, malformed rows and the need for transformations.","Describe a safe workflow for importing a CSV sales file.","Connect, preview, check delimiters and headers, then transform if required.","Get Data → Text/CSV → preview the delimiter, headers and sample rows → choose Transform Data for cleaning → validate → Close & Apply."],["Power Query: profile and clean columns","Beginner",12,"Power Query is used to clean and reshape imported data. Rename columns, set data types, remove unwanted rows and profile missing values.","Power Query records applied transformation steps and evaluates them during refresh before data is loaded into the semantic model.","Clean the spreadsheet once as a repeatable recipe instead of fixing the same issues by hand every month.","Trim text → remove duplicates (after defining the key) → set data types → replace or flag errors → Close & Apply","Why should you set the correct data type before building measures?",["Wrong types can break calculations, sorting and relationships","Data types only change cell colour","DAX ignores data types"],0,"Types determine which operations are meaningful and can affect relationships and query results.","List four Power Query checks you would run on an imported order table.","Think about headers, whitespace, data types, duplicates and missing keys.","Promote headers; trim text; set date and numeric types; profile missing values; inspect duplicates against a business key; verify row counts and totals before loading."],["Append versus Merge queries","Intermediate",11,"Append stacks rows from similar tables. Merge joins columns from related tables using matching keys.","Append combines tables vertically; Merge performs a relational join using selected key columns.","Stack January and February sales files with Append. Bring customer city into sales using Merge on CustomerID.","What is the right operation for combining two monthly sales tables with the same columns?",["Append","Merge","Drill-through"],0,"Append adds rows. Merge matches records and adds columns from another query.","Choose Append or Merge for each: stack two monthly files; add customer segment to orders by customer ID.","Stack rows = Append. Match a key to bring extra fields = Merge.","Use Append for January + February transactions. Use Merge to join orders to customers on CustomerID.",null],["Relationships: cardinality and filter direction","Intermediate",13,"Relationships connect tables in the model. A common pattern is one customer row related to many sales rows through CustomerID.","Model relationships define cardinality, active/inactive state and filter propagation between tables in a semantic model.","A customer dimension has one row per customer. The sales fact table can contain many rows for the same customer.","DimCustomer[CustomerID] 1 ─── * FactSales[CustomerID]","Which side normally has the unique customer key in a one-to-many relationship?",["The dimension (one) side","The fact (many) side only","Both sides must contain duplicates"],0,"The dimension key should be unique; the fact table can repeat the foreign key across transactions.","Explain why a many-to-many customer-to-sales relationship can be a warning sign.","Check whether the supposed customer dimension has duplicate customer IDs.","Duplicate customer IDs in the dimension may create ambiguous filtering and incorrect totals. Verify the table grain and resolve duplicates or model a bridge only when many-to-many is genuine."],["Star schema: facts and dimensions","Intermediate",13,"A star schema separates measurable business events from descriptive lookup tables. It helps create a model that is easier to reason about.","A star schema has a central fact table containing keys and measures, connected to dimension tables containing descriptive attributes.","FactSales stores transactions and sales amounts. DimDate, DimCustomer and DimProduct describe each transaction.","FactSales: DateKey, CustomerKey, ProductKey, SalesAmount\nDimCustomer: CustomerKey, City, Segment\nDimProduct: ProductKey, Category","What belongs in a fact table?",["Business events and numeric measures at a defined grain","Only descriptive labels","Report page titles"],0,"The fact table stores events or observations. Dimensions provide descriptive context for slicing and grouping.","Define the grain of a FactSales table and name three possible dimensions.","State what one row represents, then list who/what/when descriptors.","Grain example: one row per order line. Dimensions: Date, Customer and Product. Measures: Quantity, SalesAmount and Cost."],["DAX measures versus calculated columns","Intermediate",14,"A calculated column is evaluated for each row and stored in the model at refresh. A measure is calculated when the report is queried, under the current filter context.","DAX calculated columns are row-context expressions materialised during model processing; measures are evaluated at query time under filter context.","A unit price after discount is a row-level field. Total revenue should usually respond to slicers, so it is a measure.","Line Revenue = Sales[Quantity] * Sales[UnitPrice]\n\nTotal Revenue = SUM(Sales[Line Revenue])","Which is usually the right choice for a total that should respond dynamically to slicers?",["Measure","Calculated column","Text column"],0,"Measures are evaluated in filter context and respond to report filters; calculated columns are materialised per row.","Decide whether these should be a measure or calculated column: row-level line margin; total sales across selected regions.","One is a per-row attribute; the other is an aggregate that changes with filters.","Line Margin % may be a calculated column if stored per transaction; Total Sales by selected regions should be a measure."],["Create a first measure and format it","Intermediate",12,"Measures make business calculations reusable. Give measures clear names, use DIVIDE for ratios and format the result for its meaning.","A DAX measure is a named expression evaluated within the current filter context. DIVIDE handles zero or blank denominators safely.","Build total revenue once, then reuse it in cards, charts and tables without duplicating the calculation.","Total Revenue = SUM(FactSales[SalesAmount])\n\nAverage Order Value = DIVIDE([Total Revenue], [Order Count])","Why is DIVIDE often preferred to the / operator for report ratios?",["It handles zero or blank denominators with a controlled alternate result","It automatically filters the report to one city","It converts measures into columns"],0,"DIVIDE provides a safe result when the denominator is zero or blank, avoiding an uncontrolled divide-by-zero result.","Define a Total Orders measure using a unique OrderID count.","Use DISTINCTCOUNT on the order ID column.","Order Count = DISTINCTCOUNT(FactSales[OrderID])"]]};
