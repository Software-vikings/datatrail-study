14px;border-radius:10px;background:#fff7e9;border:1px solid #f4e2bd;color:#73521a;font-size:11px;line-height:1.5}.pillrow{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 11px;font-size:11px;color:#59685f}.pill.active{background:var(--green2);border-color:#b5d8c4;color:var(--green);font-weight:800}.interviewq{padding:18px;border:1px solid var(--line);border-radius:13px;margin:10px 0}.interviewq h3{font-size:14px;margin:8px 0}.answer{display:none;background:#f3f7f3;border-radius:10px;padding:12px;font-size:12px;line-height:1.6;margin-top:10px}.answer.show{display:block}.project{display:flex;flex-direction:column;gap:12px}.project h3{margin:0;font-size:15px}.check{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5;margin:8px 0}.check input{accent-color:var(--green);margin-top:2px}.toast{position:fixed;bottom:22px;right:22px;background:var(--nav);color:#fff;padding:12px 16px;border-radius:11px;font-size:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateY(0)}.modalback{position:fixed;inset:0;background:rgba(11,25,20,.55);z-index:30;display:grid;place-items:center;padding:20px}.modal{max-width:520px;width:100%;background:#fff;border-radius:20px;padding:28px;box-shadow:var(--shadow)}.modal h2{margin:8px 0}.modal p{font-size:13px;color:var(--muted);line-height:1.6}.mobilemenu{display:none}.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}

(function(){
"use strict";
const STORE="datatrail-v1";
const icons={Excel:"▦",SQL:"▣",Python:"⌁",NumPy:"∿",pandas:"▤",Statistics:"∑","Power BI":"▥"};
const lessonRows={
Excel:[
["Spreadsheet thinking","Beginner",8,"A spreadsheet is a digital ledger. Rows hold records; columns hold the details about each record.","A workbook contains worksheets made of cells arranged in rows and columns.","Think of a shop's sales register: one row per bill and one column for date, customer and amount.","A1 = Date | B1 = Customer | C1 = Amount","What does one row usually represent in a clean sales table?",["One record","One formula","One worksheet"],0,"A row represents one observation or record. A column represents one field.","Create a tiny table with three sales and columns Date, Customer and Amount.","Imagine each row is one invoice.","A clean table has one header row, one record per row and one field per column."],
["Cells, ranges and formulas","Beginner",10,"A cell is one box. A range is a group of boxes. A formula starts with an equals sign.","A formula is an expression that calculates a value from cell references, constants and operators.","A total cell can add all invoice amounts without calculating each one manually.","=C2+C3+C4  |  =SUM(C2:C4)","Which symbol tells Excel that you are entering a formula?",["#","=","@"],1,"Excel formulas begin with an equals sign.","Add the three Amount cells using SUM.","A formula begins with the equals sign.","=SUM(C2:C4) adds every value from C2 through C4."],
["Relative and absolute references","Beginner",12,"When you copy a formula, Excel adjusts normal references. A dollar sign locks a row or column.","Relative references change when copied; absolute references remain fixed.","If every product uses the same tax rate in cell F1, lock F1 when copying the tax formula.","=C2*$F$1","Which reference stays fixed when copied?",["F1","$F$1","F$"],1,"Dollar signs lock both the column and row.","Write a copied formula that multiplies each row's net sales by the tax rate in F1.","Use dollar signs on both sides of F and 1.","Use =C2*$F$1; the sales row changes but the tax-rate cell does not."],
["SUM, AVERAGE, MIN and MAX","Beginner",10,"Functions are ready-made instructions. SUM totals values; AVERAGE finds the arithmetic mean.","A worksheet function performs a predefined calculation on supplied arguments.","Monthly revenue can be totalled with SUM and typical invoice value can be measured with AVERAGE.","=SUM(C2:C20)  |  =AVERAGE(C2:C20)","Which function calculates the average?",["SUM","COUNT","AVERAGE"],2,"AVERAGE returns the arithmetic mean of numeric values.","Calculate total sales and average order value from C2:C20.","One function name literally describes the calculation.","Use =SUM(C2:C20) and =AVERAGE(C2:C20)."],
["IF, AND and OR","Intermediate",12,"IF lets a spreadsheet make a decision. It checks a condition and returns one result if true and another if false.","IF is a logical function that evaluates a test and returns separate values for TRUE and FALSE.","Label an order as High Value when its amount is at least ₹5,000.","=IF(C2>=5000,\"High Value\",\"Regular\")","What does IF do when the test is TRUE?",["Returns the second result","Returns the first result","Deletes the row"],1,"The second argument is returned when the test is TRUE.","Label values in C2 as High Value when >=5000.","The first result after the test belongs to TRUE.","=IF(C2>=5000,\"High Value\",\"Regular\")."],
["SUMIFS and COUNTIFS","Intermediate",14,"These functions answer questions with conditions. For example: total revenue in Chennai during October.","SUMIFS adds values that meet multiple criteria; COUNTIFS counts records meeting multiple criteria.","A finance analyst can total sales for one city and one month without manually filtering rows.","=SUMIFS(D:D,B:B,\"Chennai\",A:A,\">=1-Oct\")","Which function adds numbers using multiple conditions?",["COUNTIFS","SUMIFS","AVERAGE"],1,"SUMIFS is designed to sum values that match multiple criteria.","Total revenue for Chennai orders where status is Paid.","S stands for plural criteria in SUMIFS.","=SUMIFS(D:D,B:B,\"Chennai\",E:E,\"Paid\")."],
["XLOOKUP and INDEX/MATCH","Advanced",15,"A lookup finds a related value in another table. Search for a product code and return its product name or price.","Lookup functions retrieve a corresponding value from a lookup array or table.","Match a product ID on an invoice to the product catalogue to avoid retyping the name.","=XLOOKUP(A2,Products!A:A,Products!B:B,\"Not found\")","What is XLOOKUP used for?",["Finding a related value","Formatting cells","Creating charts"],0,"XLOOKUP searches for a value and returns its corresponding match.","Look up product name using ProductID in A2.","Find the ID first, then specify which column should be returned.","=XLOOKUP(A2,Products!A:A,Products!B:B,\"Not found\")."],
["PivotTables and Power Query","Advanced",18,"A PivotTable summarises a large table. Power Query imports and cleans data through repeatable steps.","PivotTables aggregate and cross-tabulate records; Power Query is an ETL tool for importing and transforming data.","Summarise monthly sales by region and product without writing dozens of formulas.","Rows: Region | Columns: Month | Values: Sum of Revenue","What is a PivotTable especially useful for?",["Summarising data","Writing Python","Changing file names"],0,"PivotTables rapidly group and aggregate tabular records.","Build a summary with Region in Rows and Revenue in Values.","Think of a PivotTable as a flexible summary report.","Drag Region to Rows and Revenue to Values, then set the value aggregation to Sum."]
],
SQL:[
["What is a database?","Beginner",8,"A database is an organised place to store information. A table is like a structured register with rows and columns.","A relational database stores related data in tables and connects those tables through keys.","Customers can live in one table and their orders in another. A customer ID connects them.","customers(customer_id, name, city)  |  orders(order_id, customer_id, amount)","In a table, what does a row represent?",["A record","A database server","A formula"],0,"Each row is one record. Each column is one attribute.","Open the SQL playground and inspect the customers table.","Look at one customer from left to right.","A row stores the values for one customer."],
["SELECT and FROM","Beginner",10,"SELECT chooses which columns you want. FROM tells SQL which table to read.","SELECT retrieves expressions or columns from a table or query result.","To inspect customer names, select the name column from the customers table.","SELECT name FROM customers;","Which keyword chooses the columns?",["FROM","SELECT","WHERE"],1,"SELECT defines the output columns.","Return customer names from the customers table.","SELECT comes before FROM.","SELECT name FROM customers;"],
["WHERE: filtering rows","Beginner",12,"WHERE keeps only the rows that match a condition, just like applying a filter in a spreadsheet.","WHERE filters rows before grouping and aggregation.","Find only orders whose amount is greater than ₹2,000.","SELECT * FROM orders WHERE amount > 2000;","Which clause filters rows?",["WHERE","ORDER BY","SELECT"],0,"WHERE is the row filter clause.","Find orders with status equal to Paid.","Write the condition after WHERE.","SELECT * FROM orders WHERE status = 'Paid';"],
["ORDER BY and LIMIT","Beginner",10,"ORDER BY sorts results. LIMIT keeps only the first few rows after sorting.","ORDER BY defines result ordering; LIMIT restricts the number of returned rows in SQLite.","Find the five largest invoices by sorting amount from highest to lowest.","SELECT * FROM orders ORDER BY amount DESC LIMIT 5;","Which keyword sorts largest to smallest?",["ASC","DESC","LIMIT"],1,"DESC means descending order.","Show the three newest orders.","Sort date descending then limit to three.","SELECT * FROM orders ORDER BY order_date DESC LIMIT 3;"],
["COUNT, SUM and GROUP BY","Intermediate",14,"GROUP BY puts similar values into buckets so you can calculate a total or count for each bucket.","Aggregate functions summarise multiple rows; GROUP BY forms groups for aggregation.","Calculate revenue by city instead of looking at every invoice.","SELECT city, SUM(amount) AS revenue FROM orders GROUP BY city;","Which function totals numeric values?",["COUNT","SUM","MAX"],1,"SUM adds the values in a group.","Count how many orders belong to each status.","Group by status and count rows.","SELECT status, COUNT(*) FROM orders GROUP BY status;"],
["JOIN: connect two tables","Intermediate",16,"A JOIN combines rows from related tables. Use a matching key, such as customer_id.","A relational join combines records using a predicate between columns from two inputs.","Attach each customer's name to their order so the report is readable.","SELECT o.order_id,c.name FROM orders o JOIN customers c ON o.customer_id=c.customer_id;","Which JOIN returns only matching rows?",["INNER JOIN","LEFT JOIN","CROSS JOIN"],0,"INNER JOIN keeps records where the join condition matches in both tables.","Show order ID, customer name and amount.","Match orders.customer_id to customers.customer_id.","SELECT o.order_id,c.name,o.amount FROM orders o INNER JOIN customers c ON o.customer_id=c.customer_id;"],
["CASE and CTEs","Advanced",16,"CASE creates categories inside a query. A CTE gives a subquery a temporary readable name.","CASE evaluates conditional branches; a common table expression (CTE) is a named temporary result defined with WITH.","Classify orders as Large or Regular, then query that result cleanly.","WITH tagged AS (SELECT *, CASE WHEN amount>=5000 THEN 'Large' ELSE 'Regular' END AS band FROM orders) SELECT band,COUNT(*) FROM tagged GROUP BY band;","Which keyword begins a CTE?",["WITH","CASE","TABLE"],0,"WITH introduces a common table expression.","Create a CTE for paid orders and count them.","Give the CTE a name after WITH.","WITH paid AS (SELECT * FROM orders WHERE status='Paid') SELECT COUNT(*) FROM paid;"],
["Window functions","Advanced",18,"Window functions calculate across related rows while keeping each individual row visible.","A window function performs calculations over a defined partition and ordering without collapsing rows.","Rank each customer's orders by amount to see their biggest purchase.","SELECT customer_id,amount,ROW_NUMBER() OVER(PARTITION BY customer_id ORDER BY amount DESC) AS rn FROM orders;","Which function assigns a row sequence within a partition?",["GROUP BY","ROW_NUMBER","SUM"],1,"ROW_NUMBER numbers rows inside each window partition.","Rank orders by amount from largest to smallest.","Add OVER with an ORDER BY inside.","SELECT order_id,amount,RANK() OVER(ORDER BY amount DESC) AS sales_rank FROM orders;"]
],
Python:[
["Your first program","Beginner",8,"A program is a set of instructions. Python lets you write those instructions in a readable way.","Python is a high-level, general-purpose programming language used for automation, analysis and software.","A tiny script can calculate the total of a few invoice amounts.","print(\"Hello, analyst!\")","Which function displays output in a basic Python script?",["show()","print()","displayText()"],1,"print() writes a value to the output stream.","Run print(\"I am learning Python\") in the Python lab.","The function name means to print something.","print(\"I am learning Python\")"],
["Variables and data types","Beginner",10,"A variable is a named box that stores a value. Values can be numbers, text, True/False and more.","A variable name refers to an object bound in the current namespace; Python is dynamically typed.","Store revenue as a number and a customer's name as text.","revenue = 12500\\ncustomer = \"Asha\"\\npaid = True","Which data type is the value \"₹500\" if written as text?",["int","str","bool"],1,"Quotation marks make it a string (str), even if the characters look numeric.","Create variables for sales=1200 and region=\"Chennai\".","Text goes inside quotation marks.","sales = 1200\\nregion = \"Chennai\""],
["Numbers, strings and conversion","Beginner",12,"Input often arrives as text. Convert it before doing arithmetic.","Type conversion transforms a value from one data type to another.","Convert the text \"450\" into a number before adding tax.","amount_text = \"450\"\\namount = int(amount_text)\\nprint(amount + 50)","Which converts a numeric string to an integer?",["str()","int()","bool()"],1,"int() converts an appropriate string or number into an integer.","Convert price_text=\"99\" and add 1.","Use int() around the text.","price_text = \"99\"\\nprice = int(price_text)\\nprint(price + 1)"],

["Population, sample and variables","Beginner",8,"A population is everyone you care about. A sample is the smaller group you actually measure.","A population is the complete target set; a sample is an observed subset used to infer population properties.","You may survey 200 customers to understand satisfaction among all 20,000 customers.","Population: all customers | Sample: surveyed customers","Why do analysts use samples?",["To estimate a larger population efficiently","To avoid collecting any data","To guarantee no bias"],0,"A sample reduces the cost and time needed to learn about a larger population.","Identify the population and sample in a survey of 100 out of 2,000 buyers.","Separate the full group from the measured subset.","Population = 2,000 buyers; sample = 100 surveyed buyers."],
["Mean, median and mode","Beginner",10,"Mean is the average. Median is the middle after sorting. Mode is the most frequent value.","Measures of central tendency describe a typical value in a distribution.","A few very large invoices can pull the mean up; the median may better represent a typical order.","Values: 100, 120, 130, 150, 900 | Mean = 280 | Median = 130","Which measure is least affected by one extreme value?",["Mean","Median","Sum"],1,"The median depends on the central position, not the size of every value.","Find the median of 10, 20, 30, 40, 500.","Sort and take the middle value (or average the two middle values).","Median = 30."],
["Range, variance and standard deviation","Beginner",12,"These measures describe how spread out values are. A small standard deviation means values tend to stay near the mean.","Variance is average squared deviation (with sample/population variants); standard deviation is its square root.","Compare two stores with the same average sales but very different day-to-day volatility.","Low spread: 95,100,105 | High spread: 20,100,180","What does standard deviation measure?",["Spread around the mean","The most common value","The sample size"],0,"Standard deviation quantifies dispersion around the mean.","Compare daily sales [90,100,110] and [30,100,170].","The second list has values farther from the centre.","The second list has a larger standard deviation and more variability."],
["Percentiles and outliers","Intermediate",12,"A percentile says what percentage of values are at or below a point. The IQR helps flag unusual values.","The interquartile range is Q3−Q1; the 1.5×IQR rule is a common exploratory outlier flag.","Find unusually large order amounts that may represent bulk purchases or data-entry errors.","IQR = Q3 - Q1","What is the interquartile range?",["Q3 minus Q1","Maximum minus minimum","Mean divided by n"],0,"IQR measures the spread of the middle 50% of observations.","For Q1=20 and Q3=60, calculate IQR.","Subtract the first quartile from the third.","IQR = 60 - 20 = 40."],
["Sampling methods and bias","Intermediate",14,"A sample can be large and still unfair. If you only ask loyal customers, you may miss unhappy customers who left.","Sampling bias occurs when the selection process systematically favours some outcomes or groups.","A survey shown only inside a premium store may not represent every customer segment.","Simple random, stratified, systematic, cluster, convenience","What is a likely source of sampling bias?",["Only surveying customers who visit the website","Randomly selecting from all customers","Stratifying by region"],0,"The website-only survey systematically excludes offline customers.","Suggest a fair way to sample customers across four regions.","Make sure every important region has representation.","Use stratified random sampling by region."],

["Hypothesis tests, p-values and ANOVA","Advanced",18,"A test asks whether data are surprising under a stated null hypothesis. A p-value is not the probability that the null is true.","Hypothesis testing evaluates sample evidence against a null model; ANOVA compares means across multiple groups using variance decomposition.","Test whether a new checkout flow changed average order value, or whether average sales differ across three branches.","H0: no difference | H1: a difference exists","If p = 0.03 and alpha = 0.05, what is the usual decision?",["Reject H0","Prove H1 is true","Accept H0 as certainly true"],0,"The result is statistically significant at the 5% threshold, but that does not prove the alternative.","Interpret p=0.03 with alpha=0.05 without saying the null has a 3% probability.","Compare p to alpha and describe evidence under H0.","Since 0.03 < 0.05, reject H0; the result is statistically significant at the 5% level."]
