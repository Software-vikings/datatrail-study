["Spreadsheet thinking","Beginner",8,"A spreadsheet is a digital ledger. Rows hold records; columns hold the details about each record.","A workbook contains worksheets made of cells arranged in rows and columns.","Think of a shop's sales register: one row per bill and one column for date, customer and amount.","A1 = Date | B1 = Customer | C1 = Amount","What does one row usually represent in a clean sales table?",["One record","One formula","One worksheet"],0,"A row represents one observation or record. A column represents one field.","Create a tiny table with three sales and columns Date, Customer and Amount.","Imagine each row is one invoice.","A clean table has one header row, one record per row and one field per column."],
["Cells, ranges and formulas","Beginner",10,"A cell is one box. A range is a group of boxes. A formula starts with an equals sign.","A formula is an expression that calculates a value from cell references, constants and operators.","A total cell can add all invoice amounts without calculating each one manually.","=C2+C3+C4  |  =SUM(C2:C4)","Which symbol tells Excel that you are entering a formula?",["#","=","@"],1,"Excel formulas begin with an equals sign.","Add the three Amount cells using SUM.","A formula begins with the equals sign.","=SUM(C2:C4) adds every value from C2 through C4."],
["Relative and absolute references","Beginner",12,"When you copy a formula, Excel adjusts normal references. A dollar sign locks a row or column.","Relative references change when copied; absolute references remain fixed.","If every product uses the same tax rate in cell F1, lock F1 when copying the tax formula.","=C2*$F$1","Which reference stays fixed when copied?",["F1","$F$1","F$"],1,"Dollar signs lock both the column and row.","Write a copied formula that multiplies each row's net sales by the tax rate in F1.","Use dollar signs on both sides of F and 1.","Use =C2*$F$1; the sales row changes but the tax-rate cell does not."],
["SUM, AVERAGE, MIN and MAX","Beginner",10,"Functions are ready-made instructions. SUM totals values; AVERAGE finds the arithmetic mean.","A worksheet function performs a predefined calculation on supplied arguments.","Monthly revenue can be totalled with SUM and typical invoice value can be measured with AVERAGE.","=SUM(C2:C20)  |  =AVERAGE(C2:C20)","Which function calculates the average?",["SUM","COUNT","AVERAGE"],2,"AVERAGE returns the arithmetic mean of numeric values.","Calculate total sales and average order value from C2:C20.","One function name literally describes the calculation.","Use =SUM(C2:C20) and =AVERAGE(C2:C20)."],
["IF, AND and OR","Intermediate",12,"IF lets a spreadsheet make a decision. It checks a condition and returns one result if true and another if false.","IF is a logical function that evaluates a test and returns separate values for TRUE and FALSE.","Label an order as High Value when its amount is at least ₹5,000.","=IF(C2>=5000,\"High Value\",\"Regular\")","What does IF do when the test is TRUE?",["Returns the second result","Returns the first result","Deletes the row"],1,"The second argument is returned when the test is TRUE.","Label values in C2 as High Value when >=5000.","The first result after the test belongs to TRUE.","=IF(C2>=5000,\"High Value\",\"Regular\")."],
["SUMIFS and COUNTIFS","Intermediate",14,"These functions answer questions with conditions. For example: total revenue in Chennai during October.","SUMIFS adds values that meet multiple criteria; COUNTIFS counts records meeting multiple criteria.","A finance analyst can total sales for one city and one month without manually filtering rows.","=SUMIFS(D:D,B:B,\"Chennai\",A:A,\">=1-Oct\")","Which function adds numbers using multiple conditions?",["COUNTIFS","SUMIFS","AVERAGE"],1,"SUMIFS is designed to sum values that match multiple criteria.","Total revenue for Chennai orders where status is Paid.","S stands for plural criteria in SUMIFS.","=SUMIFS(D:D,B:B,\"Chennai\",E:E,\"Paid\")."],
["XLOOKUP and INDEX/MATCH","Advanced",15,"A lookup finds a related value in another table. Search for a product code and return its product name or price.","Lookup functions retrieve a corresponding value from a lookup array or table.","Match a product ID on an invoice to the product catalogue to avoid retyping the name.","=XLOOKUP(A2,Products!A:A,Products!B:B,\"Not found\")","What is XLOOKUP used for?",["Finding a related value","Formatting cells","Creating charts"],0,"XLOOKUP searches for a value and returns its corresponding match.","Look up product name using ProductID in A2.","Find the ID first, then specify which column should be returned.","=XLOOKUP(A2,Products!A:A,Products!B:B,\"Not found\")."],
["PivotTables and Power Query","Advanced",18,"A PivotTable summarises a large table. Power Query imports and cleans data through repeatable steps.","PivotTables aggregate and cross-tabulate records; Power Query is an ETL tool for importing and transforming data.","Summarise monthly sales by region and product without writing dozens of formulas.","Rows: Region | Columns: Month | Values: Sum of Revenue","What is a PivotTable especially useful for?",["Summarising data","Writing Python","Changing file names"],0,"PivotTables rapidly group and aggregate tabular records.","Build a summary with Region in Rows and Revenue in Values.","Think of a PivotTable as a flexible summary report.","Drag Region to Rows and Revenue to Values, then set the value aggregation to Sum."]

SQL:[
["What is a database?","Beginner",8,"A database is an organised place to store information. A table is like a structured register with rows and columns.","A relational database stores related data in tables and connects those tables through keys.","Customers can live in one table and their orders in another. A customer ID connects them.","customers(customer_id, name, city)  |  orders(order_id, customer_id, amount)","In a table, what does a row represent?",["A record","A database server","A formula"],0,"Each row is one record. Each column is one attribute.","Open the SQL playground and inspect the customers table.","Look at one customer from left to right.","A row stores the values for one customer."],
["SELECT and FROM","Beginner",10,"SELECT chooses which columns you want. FROM tells SQL which table to read.","SELECT retrieves expressions or columns from a table or query result.","To inspect customer names, select the name column from the customers table.","SELECT name FROM customers;","Which keyword chooses the columns?",["FROM","SELECT","WHERE"],1,"SELECT defines the output columns.","Return customer names from the customers table.","SELECT comes before FROM.","SELECT name FROM customers;"],
["WHERE: filtering rows","Beginner",12,"WHERE keeps only the rows that match a condition, just like applying a filter in a spreadsheet.","WHERE filters rows before grouping and aggregation.","Find only orders whose amount is greater than ₹2,000.","SELECT * FROM orders WHERE amount > 2000;","Which clause filters rows?",["WHERE","ORDER BY","SELECT"],0,"WHERE is the row filter clause.","Find orders with status equal to Paid.","Write the condition after WHERE.","SELECT * FROM orders WHERE status = 'Paid';"],
["ORDER BY and LIMIT","Beginner",10,"ORDER BY sorts results. LIMIT keeps only the first few rows after sorting.","ORDER BY defines result ordering; LIMIT restricts the number of returned rows in SQLite.","Find the five largest invoices by sorting amount from highest to lowest.","SELECT * FROM orders ORDER BY amount DESC LIMIT 5;","Which keyword sorts largest to smallest?",["ASC","DESC","LIMIT"],1,"DESC means descending order.","Show the three newest orders.","Sort date descending then limit to three.","SELECT * FROM orders ORDER BY order_date DESC LIMIT 3;"],
["COUNT, SUM and GROUP BY","Intermediate",14,"GROUP BY puts similar values into buckets so you can calculate a total or count for each bucket.","Aggregate functions summarise multiple rows; GROUP BY forms groups for aggregation.","Calculate revenue by city instead of looking at every invoice.","SELECT city, SUM(amount) AS revenue FROM orders GROUP BY city;","Which function totals numeric values?",["COUNT","SUM","MAX"],1,"SUM adds the values in a group.","Count how many orders belong to each status.","Group by status and count rows.","SELECT status, COUNT(*) FROM orders GROUP BY status;"],
["JOIN: connect two tables","Intermediate",16,"A JOIN combines rows from related tables. Use a matching key, such as customer_id.","A relational join combines records using a predicate between columns from two inputs.","Attach each customer's name to their order so the report is readable.","SELECT o.order_id,c.name FROM orders o JOIN customers c ON o.customer_id=c.customer_id;","Which JOIN returns only matching rows?",["INNER JOIN","LEFT JOIN","CROSS JOIN"],0,"INNER JOIN keeps records where the join condition matches in both tables.","Show order ID, customer name and amount.","Match orders.customer_id to customers.customer_id.","SELECT o.order_id,c.name,o.amount FROM orders o INNER JOIN customers c ON o.customer_id=c.customer_id;"],
["CASE and CTEs","Advanced",16,"CASE creates categories inside a query. A CTE gives a subquery a temporary readable name.","CASE evaluates conditional branches; a common table expression (CTE) is a named temporary result defined with WITH.","Classify orders as Large or Regular, then query that result cleanly.","WITH tagged AS (SELECT *, CASE WHEN amount>=5000 THEN 'Large' ELSE 'Regular' END AS band FROM orders) SELECT band,COUNT(*) FROM tagged GROUP BY band;","Which keyword begins a CTE?",["WITH","CASE","TABLE"],0,"WITH introduces a common table expression.","Create a CTE for paid orders and count them.","Give the CTE a name after WITH.","WITH paid AS (SELECT * FROM orders WHERE status='Paid') SELECT COUNT(*) FROM paid;"],
["Window functions","Advanced",18,"Window functions calculate across related rows while keeping each individual row visible.","A window function performs calculations over a defined partition and ordering without collapsing rows.","Rank each customer's orders by amount to see their biggest purchase.","SELECT customer_id,amount,ROW_NUMBER() OVER(PARTITION BY customer_id ORDER BY amount DESC) AS rn FROM orders;","Which function assigns a row sequence within a partition?",["GROUP BY","ROW_NUMBER","SUM"],1,"ROW_NUMBER numbers rows inside each window partition.","Rank orders by amount from largest to smallest.","Add OVER with an ORDER BY inside.","SELECT order_id,amount,RANK() OVER(ORDER BY amount DESC) AS sales_rank FROM orders;"]
],
Python:[
["Your first program","Beginner",8,"A program is a set of instructions. Python lets you write those instructions in a readable way.","Python is a high-level, general-purpose programming language used for automation, analysis and software.","A tiny script can calculate the total of a few invoice amounts.","print(\"Hello, analyst!\")","Which function displays output in a basic Python script?",["show()","print()","displayText()"],1,"print() writes a value to the output stream.","Run print(\"I am learning Python\") in the Python lab.","The function name means to print something.","print(\"I am learning Python\")"],
["Variables and data types","Beginner",10,"A variable is a named box that stores a value. Values can be numbers, text, True/False and more.","A variable name refers to an object bound in the current namespace; Python is dynamically typed.","Store revenue as a number and a customer's name as text.","revenue = 12500\\ncustomer = \"Asha\"\\npaid = True","Which data type is the value \"₹500\" if written as text?",["int","str","bool"],1,"Quotation marks make it a string (str), even if the characters look numeric.","Create variables for sales=1200 and region=\"Chennai\".","Text goes inside quotation marks.","sales = 1200\\nregion = \"Chennai\""],
["Numbers, strings and conversion","Beginner",12,"Input often arrives as text. Convert it before doing arithmetic.","Type conversion transforms a value from one data type to another.","Convert the text \"450\" into a number before adding tax.","amount_text = \"450\"\\namount = int(amount_text)\\nprint(amount + 50)","Which converts a numeric string to an integer?",["str()","int()","bool()"],1,"int() converts an appropriate string or number into an integer.","Convert price_text=\"99\" and add 1.","Use int() around the text.","price_text = \"99\"\\nprice = int(price_text)\\nprint(price + 1)"],
["Lists and dictionaries","Beginner",14,"A list stores an ordered collection. A dictionary stores values under meaningful keys.","Lists are mutable sequences; dictionaries are key-value mappings.","Store daily sales in a list; store customer details in a dictionary.","sales = [1200, 900, 1500]\\ncustomer = {\"name\":\"Asha\", \"city\":\"Chennai\"}","How do you access the city in customer?",["customer.city","customer[\"city\"]","customer( city )"],1,"Dictionary values are accessed using their keys inside square brackets.","Create a list of three expenses and print the second one.","Python list positions begin at zero.","expenses = [100, 250, 80]\\nprint(expenses[1])"],
["Conditions and loops","Intermediate",14,"A condition chooses a path. A loop repeats a task without copying the same instruction many times.","if/elif/else provide conditional execution; for and while implement iteration.","Label orders as high value when their amount exceeds a threshold; loop over every order.","for amount in [1200, 7000, 2600]:\\n    if amount > 5000:\\n        print(\"High\")\\n    else:\\n        print(\"Regular\")","What does a for loop do?",["Repeats over items","Creates a spreadsheet","Deletes variables"],0,"A for loop iterates over items in an iterable.","Print each item in [10,20,30].","Start with for item in the list, then indent print.","for item in [10,20,30]:\\n    print(item)"],
["Functions","Intermediate",14,"A function is a reusable mini-program. Give it input, let it work, and return an answer.","A function is a named callable block defined with def; return passes a result to the caller.","Use one function to calculate net sales for every invoice.","def net_sales(gross, discount):\\n    return gross - discount\\n\\nprint(net_sales(1000,100))","Which keyword defines a function?",["function","def","make"],1,"Python uses def to define functions.","Write a function that returns price multiplied by quantity.","Use def, parameters, and return.","def revenue(price, quantity):\\n    return price * quantity\\n\\nprint(revenue(250,4))"],
["Files, errors and debugging","Advanced",15,"Real analysis often starts with a CSV file. Errors are clues that tell you what went wrong.","File I/O reads and writes persistent data; exceptions are runtime events that can be handled with try/except.","Handle a missing input file without crashing an entire reporting script.","try:\\n    with open(\"sales.csv\") as file:\\n        data = file.read()\\nexcept FileNotFoundError:\\n    print(\"File not found\")","Which block handles an exception?",["try","except","return"],1,"except handles a matching exception raised inside try.","Safely convert \"not a number\" to an integer and print a friendly message.","Put int conversion in a try block.","try:\\n    value = int(\"abc\")\\nexcept ValueError:\\n    print(\"Please enter a valid number\")"],
["Comprehensions and clean code","Advanced",16,"A list comprehension creates a new list from an expression and a loop in one readable line.","A comprehension constructs a collection from an iterable with optional filtering.","Create a list of orders above ₹1,000 from a raw list.","amounts = [200, 1800, 950, 2200]\\nhigh_value = [x for x in amounts if x > 1000]","What does a list comprehension produce?",["A list","A database","A function"],0,"A list comprehension produces a list.","Create a list of doubled numbers from [1,2,3].","Put the expression before the for clause.","doubled = [x * 2 for x in [1,2,3]]"]
],
NumPy:[
["Why NumPy arrays?","Beginner",8,"A Python list is flexible. A NumPy array is designed for fast numerical work on many values.","NumPy provides an N-dimensional homogeneous array and vectorised numerical operations.","Calculate thousands of monthly product metrics without writing a loop for every item.","import numpy as np\\nsales = np.array([120, 150, 90])","What kind of work is NumPy designed for?",["Numerical arrays","Web styling","SQL joins"],0,"NumPy is a core library for numerical computing in Python.","Create an array containing 10, 20 and 30.","Use np.array with a list.","sales = np.array([10,20,30])"],
["Create arrays","Beginner",10,"Use array to convert a list, arange for steps and zeros/ones for initial values.","NumPy constructors create arrays with selected values, shape and data type.","Generate a sequence of month indexes from 1 to 12.","np.arange(1,13)","Which function creates evenly spaced integer steps?",["np.arange","np.merge","np.group"],0,"arange creates values over a half-open interval.","Create values 0 through 4.","The stop value is excluded.","np.arange(0,5)"],
["Shape, dimensions and dtype","Beginner",10,"Shape tells you the number of rows and columns. dtype tells you the kind of values stored.","shape is a tuple of axis lengths; ndim is number of axes; dtype describes element type.","Before calculating a matrix, check whether it contains 12 rows and 3 columns.","data.shape  |  data.ndim  |  data.dtype","What does shape describe?",["Array dimensions","The colour","The file name"],0,"shape lists the size along each axis.","Create a 2x2 array and inspect its shape.","Two nested lists create two rows.","matrix = np.array([[1,2],[3,4]])\\nprint(matrix.shape)"],
["Indexing and slicing","Intermediate",12,"Select one item with an index, or a group with a slice. In 2D, use row and column positions.","Indexing selects array elements; slicing selects a range along one or more axes.","Extract the revenue column from a table of numerical data.","data[:, 1]  # all rows, second column","How do Python indexes begin?",["At 1","At 0","At -1 only"],1,"The first item is at index zero.","Select the first row from matrix.","Use index 0 before the comma.","matrix[0, :]"],
["Vectorisation","Intermediate",12,"Instead of looping through each number, apply the operation to the whole array.","Vectorisation expresses operations over arrays and delegates loops to optimised compiled code.","Apply a 10% price increase to an entire product-price array.","prices * 1.10","What does vectorisation reduce?",["Manual Python loops","Array size always","The number of columns"],0,"Vectorised expressions avoid writing an explicit Python loop for elementwise work.","Add 5 to every value in values.","Use the arithmetic operator on the full array.","values + 5"],
["Broadcasting","Advanced",14,"Broadcasting lets arrays of compatible shapes work together without manually repeating values.","Broadcasting compares dimensions from the end and permits equal sizes or dimensions of size one.","Add a tax-rate vector to every product row in a matrix.","prices = np.array([[100,200],[300,400]])\\ntax = np.array([.05,.10])","Which dimensions are compatible in broadcasting?",["Equal or one","Only both zero","Never different"],0,"Dimensions match when equal or one of them is 1.","Add [10,20] to each row of a 2x2 matrix.","The 1D vector aligns with the last dimension.","matrix + np.array([10,20])"],
["Aggregation and axis","Advanced",14,"sum can total everything, each column or each row depending on axis.","Aggregation reduces array dimensions by applying a reduction along a specified axis.","Calculate total revenue by product across all months.","sales.sum(axis=0)","For a 2D array, axis=0 reduces which dimension?",["Rows, leaving columns","Columns, leaving rows","Neither"],0,"axis=0 collapses the row dimension and returns one result per column.","Find the total of each row.","Use axis=1 to aggregate across columns.","sales.sum(axis=1)"],
["Boolean masks and NaN","Advanced",15,"A boolean mask selects values meeting a condition. NaN represents a missing numerical value.","Boolean indexing filters array elements; NaN is a floating-point marker for an undefined or missing numeric value.","Keep only transactions above the refund threshold and identify incomplete values.","sales[sales > 100]  |  np.isnan(values)","What does np.isnan(x) test?",["Whether values are missing NaN","Whether values are negative","Whether values are unique"],0,"isnan returns a boolean result identifying NaN values.","Filter numbers greater than 50.","Put the condition inside square brackets.","values[values > 50]"]
],
pandas:[
["Series and DataFrame","Beginner",8,"A Series is one labelled column. A DataFrame is a complete table made of columns.","Series is a one-dimensional labelled array; DataFrame is a two-dimensional tabular data structure.","An orders DataFrame can hold order_id, date, customer_id and revenue together.","df = pd.DataFrame({\"city\":[\"Chennai\",\"Pune\"],\"sales\":[1200,900]})","What is a pandas DataFrame closest to?",["A table","A loop","A chart"],0,"A DataFrame is a labelled two-dimensional table.","Create a DataFrame with item and price columns.","Use pd.DataFrame with a dictionary.","df = pd.DataFrame({\"item\":[\"Pen\",\"Book\"],\"price\":[10,50]})"],
["Read and inspect files","Beginner",10,"Load a CSV and look at the first rows before doing analysis.","read_csv loads delimited text data; head, info and describe help inspect structure and summary statistics.","Start every reporting task by checking row count, column types and sample values.","df = pd.read_csv(\"orders.csv\")\\ndf.head()\\ndf.info()","Which method shows the first five rows by default?",["tail()","head()","describe()"],1,"head returns the first rows.","Load orders.csv and inspect its first 5 records.","Use read_csv and call head.","df = pd.read_csv(\"orders.csv\")\\nprint(df.head())"],
["Select, filter and sort","Beginner",12,"Choose columns, keep rows that match a condition, and sort the result.","Column selection and boolean indexing return subsets; sort_values orders by one or more columns.","Find paid orders above ₹2,000 and sort by amount.","df.loc[df[\"status\"]==\"Paid\"].sort_values(\"amount\",ascending=False)","Which method sorts DataFrame rows by values?",["sort_values","groupby","merge"],0,"sort_values sorts by the specified column values.","Filter revenue above 1000.","Use a boolean condition inside df brackets.","df[df[\"amount\"] > 1000]"],
["Missing and duplicate data","Intermediate",13,"Check whether data is missing or repeated before calculating totals.","isna detects missing values; dropna removes them; fillna imputes values; duplicated identifies repeated records.","A repeated invoice could double-count revenue; a missing date can break monthly reporting.","df.isna().sum()  |  df.duplicated().sum()","Which method identifies missing values?",["isna","unique","sort"],0,"isna marks null/missing values.","Count missing values per column.","Call isna then sum.","df.isna().sum()"],
["Data types and dates","Intermediate",13,"Make sure numbers are numbers and dates are dates. Text that looks like a date isn't automatically a date.","astype converts dtypes; to_datetime parses date-like values into datetime objects.","Convert invoice_date before grouping revenue by month.","df[\"date\"] = pd.to_datetime(df[\"date\"])","Which function converts strings to datetime?",["to_numeric","to_datetime","to_csv"],1,"to_datetime parses date representations.","Convert the date column to datetime.","Use the pandas date parser.","df[\"date\"] = pd.to_datetime(df[\"date\"])"],
["GroupBy and aggregation","Intermediate",15,"groupby splits rows into groups, calculates a result for each group, and combines the summaries.","GroupBy implements split-apply-combine over one or more keys.","Calculate sales by city and payment status.","df.groupby([\"city\",\"status\"])[\"amount\"].sum()","What does groupby help you do?",["Summarise by categories","Rename a file","Open a website"],0,"groupby applies aggregations to groups of records.","Count orders by city.","Group by city then count order IDs.","df.groupby(\"city\")[\"order_id\"].count()"],
["Merge, join and concat","Advanced",15,"merge matches tables using keys. concat stacks tables along rows or columns.","merge performs database-style joins; concat concatenates pandas objects along an axis.","Attach customer details to each order using customer_id.","orders.merge(customers,on=\"customer_id\",how=\"left\")","Which method combines tables using a shared key?",["concat","merge","pivot"],1,"merge matches records using join keys.","Join orders to customers and keep every order.","Use left to retain every row in the left table.","orders.merge(customers,on=\"customer_id\",how=\"left\")"],
["Pivot tables and export","Advanced",14,"A pivot table turns detail rows into a compact summary. Export clean output for a report.","pivot_table aggregates values across categorical dimensions; to_csv serialises a DataFrame.","Build a report of monthly revenue by city and save it for sharing.","pd.pivot_table(df,index=\"city\",columns=\"month\",values=\"amount\",aggfunc=\"sum\")","Which method exports a DataFrame to CSV?",["to_csv","read_csv","head"],0,"to_csv writes the DataFrame to a CSV file.","Save summary as sales_summary.csv.","Use the export method on the DataFrame.","summary.to_csv(\"sales_summary.csv\",index=False)"]

Statistics:[
["Population, sample and variables","Beginner",8,"A population is everyone you care about. A sample is the smaller group you actually measure.","A population is the complete target set; a sample is an observed subset used to infer population properties.","You may survey 200 customers to understand satisfaction among all 20,000 customers.","Population: all customers | Sample: surveyed customers","Why do analysts use samples?",["To estimate a larger population efficiently","To avoid collecting any data","To guarantee no bias"],0,"A sample reduces the cost and time needed to learn about a larger population.","Identify the population and sample in a survey of 100 out of 2,000 buyers.","Separate the full group from the measured subset.","Population = 2,000 buyers; sample = 100 surveyed buyers."],
["Mean, median and mode","Beginner",10,"Mean is the average. Median is the middle after sorting. Mode is the most frequent value.","Measures of central tendency describe a typical value in a distribution.","A few very large invoices can pull the mean up; the median may better represent a typical order.","Values: 100, 120, 130, 150, 900 | Mean = 280 | Median = 130","Which measure is least affected by one extreme value?",["Mean","Median","Sum"],1,"The median depends on the central position, not the size of every value.","Find the median of 10, 20, 30, 40, 500.","Sort and take the middle value (or average the two middle values).","Median = 30."],
["Range, variance and standard deviation","Beginner",12,"These measures describe how spread out values are. A small standard deviation means values tend to stay near the mean.","Variance is average squared deviation (with sample/population variants); standard deviation is its square root.","Compare two stores with the same average sales but very different day-to-day volatility.","Low spread: 95,100,105 | High spread: 20,100,180","What does standard deviation measure?",["Spread around the mean","The most common value","The sample size"],0,"Standard deviation quantifies dispersion around the mean.","Compare daily sales [90,100,110] and [30,100,170].","The second list has values farther from the centre.","The second list has a larger standard deviation and more variability."],
["Percentiles and outliers","Intermediate",12,"A percentile says what percentage of values are at or below a point. The IQR helps flag unusual values.","The interquartile range is Q3−Q1; the 1.5×IQR rule is a common exploratory outlier flag.","Find unusually large order amounts that may represent bulk purchases or data-entry errors.","IQR = Q3 - Q1","What is the interquartile range?",["Q3 minus Q1","Maximum minus minimum","Mean divided by n"],0,"IQR measures the spread of the middle 50% of observations.","For Q1=20 and Q3=60, calculate IQR.","Subtract the first quartile from the third.","IQR = 60 - 20 = 40."],
["Sampling methods and bias","Intermediate",14,"A sample can be large and still unfair. If you only ask loyal customers, you may miss unhappy customers who left.","Sampling bias occurs when the selection process systematically favours some outcomes or groups.","A survey shown only inside a premium store may not represent every customer segment.","Simple random, stratified, systematic, cluster, convenience","What is a likely source of sampling bias?",["Only surveying customers who visit the website","Randomly selecting from all customers","Stratifying by region"],0,"The website-only survey systematically excludes offline customers.","Suggest a fair way to sample customers across four regions.","Make sure every important region has representation.","Use stratified random sampling by region."],
["Probability and distributions","Intermediate",14,"Probability describes how likely an event is. A distribution shows how values occur across observations.","Probability assigns likelihoods to events; a probability distribution maps outcomes to probabilities or densities.","Estimate refund probability from historical order data and understand normal-looking variation.","P(event) = favourable outcomes / all equally likely outcomes","What is the probability of rolling an even number on a fair six-sided die?",["1/6","1/2","2/3"],1,"Three of six faces are even, so 3/6 = 1/2.","If 8 of 100 orders are returned, estimate the return rate.","Divide returned orders by all orders.","8/100 = 0.08 or 8%."],
["Confidence intervals and standard error","Advanced",16,"A confidence interval gives a range of plausible values for a population parameter under a method with a stated long-run coverage.","A confidence interval is an interval estimator constructed using a sampling distribution and confidence level.","Estimate average order value with a margin of uncertainty instead of reporting one sample mean as exact.","Estimate ± critical value × standard error","What happens to standard error when sample size increases (all else equal)?",["It generally decreases","It always doubles","It becomes zero"],0,"Larger samples generally make the sample mean more precise; standard error falls with square root of n.","Explain what a 95% confidence interval means in plain language.","Think of repeated samples and the procedure's long-run coverage.","Across repeated samples, about 95% of intervals constructed by this method would contain the true parameter."],
["Hypothesis tests, p-values and ANOVA","Advanced",18,"A test asks whether data are surprising under a stated null hypothesis. A p-value is not the probability that the null is true.","Hypothesis testing evaluates sample evidence against a null model; ANOVA compares means across multiple groups using variance decomposition.","Test whether a new checkout flow changed average order value, or whether average sales differ across three branches.","H0: no difference | H1: a difference exists","If p = 0.03 and alpha = 0.05, what is the usual decision?",["Reject H0","Prove H1 is true","Accept H0 as certainly true"],0,"The result is statistically significant at the 5% threshold, but that does not prove the alternative.","Interpret p=0.03 with alpha=0.05 without saying the null has a 3% probability.","Compare p to alpha and describe evidence under H0.","Since 0.03 < 0.05, reject H0; the result is statistically significant at the 5% level."]
],
"Power BI":[
["What is business intelligence?","Beginner",8,"Business intelligence turns raw data into reports that help people make decisions.","BI comprises processes and tools for collecting, modelling, analysing and presenting business data.","A manager can see revenue by month, region and product instead of manually combining spreadsheets.","Orders → Clean data → Model → Measures → Report","What is the main purpose of a BI report?",["Support decisions","Replace all databases","Write Python automatically"],0,"BI reports organise information so a decision-maker can act.","Write one business question a sales dashboard should answer.","Think about an action the manager needs to take.","Example: Which region has the highest revenue this quarter?"],
["Import data and Power Query","Beginner",12,"Bring tables into Power BI. Power Query is where you clean, reshape and prepare the data before modelling.","Power Query is an ETL/data preparation layer used to connect, transform and load data.","Remove blank rows, fix data types and standardise city names before building a dashboard.","Get Data → Transform Data → Close & Apply","Where do you typically clean imported tables?",["Power Query","A chart title","The report canvas only"],0,"Power Query is designed for repeatable data preparation.","List two cleaning steps for an orders file.","Think about duplicates, types and missing values.","Remove duplicates and convert order_date to Date type."],
["Relationships and keys","Intermediate",13,"Relationships connect tables so filters can flow across the model. Keys identify records.","A relationship defines cardinality and filter propagation between model tables using related columns.","Connect orders.customer_id to customers.customer_id to analyse revenue by customer city.","Customers[customer_id] 1 → * Orders[customer_id]","A customer with many orders usually forms which relationship?",["One-to-many","One-to-one","Many-to-many always"],0,"One customer can relate to many orders.","Identify the one-side and many-side of Products to OrderItems.","Count whether each product appears in multiple order items.","Products is usually the one-side; OrderItems is the many-side."],
["Fact tables and star schema","Intermediate",14,"The fact table holds events or measurements. Dimension tables describe them, such as customer, date and product.","A star schema organises measures in a central fact table linked to denormalised dimensions.","Orders or order lines form facts; customer, product and date provide descriptive context.","DimCustomer → FactSales ← DimProduct","Where does a sales amount usually live?",["Fact table","Customer dimension","Calendar label"],0,"The fact table stores numeric business events and measures.","Sketch a fact table and two dimensions for sales.","Put transaction-level amounts in the centre.","FactSales has date_key, customer_key, product_key, quantity and sales_amount."],

const foundations = {"Excel":[["What is a dataset?","Beginner",8,"A dataset is a collection of related facts. In a sales file, one dataset might contain every order made by a shop.","A dataset is a structured collection of observations and the variables recorded about them.","Think of a shop's register: every bill is one observation, and the details written for it are the variables.","A small sales dataset might contain Order ID, Date, City, Product and Revenue.","In a sales dataset, what does one row usually describe?",["One order or record","One workbook","One formula"],0,"A row normally represents one observation, such as one order. The columns describe that observation.","Imagine you are given a file of 500 shop orders. Write down three questions you could answer from it.","Ask questions about amount, place, product or time.","You could ask which city generated the most revenue, which product sold most often, and how sales changed by month."],["Rows, columns and headers","Beginner",8,"Rows go across. Columns go down. The top row usually gives each column its name.","A tabular dataset stores observations in rows and attributes in columns, with a single header row identifying each attribute.","A class attendance register has one row per student and one column for each detail, such as name or attendance.","OrderID | City | Revenue\n1001 | Chennai | 1200\n1002 | Pune | 5400","Where should a field name such as Revenue normally appear?",["In the header row","In every cell","Only in the file name"],0,"A clear header row names each field once. Do not repeat headings between records.","For a table with OrderID, City and Revenue, identify which part should be the header and what one row represents.","The header names the fields. The first data row is one order.","The header is OrderID, City and Revenue. Each data row represents one order."],["Cell addresses: A1, B2 and ranges","Beginner",8,"Every Excel cell has an address. The letter tells you the column and the number tells you the row.","A cell reference identifies a worksheet cell by its column label and row number; a range identifies a group of cells.","It works like a seat number: column B and row 3 meet at cell B3.","A1 = column A, row 1\nC4 = column C, row 4\nB2:B6 = cells B2 through B6","What does the 5 mean in cell D5?",["Column 5","Row 5","Worksheet 5"],1,"Excel addresses are column first, row second. The colon joins the first and last cells of a range.","A sales amount is in cell D5. Write its address, then write the range covering D2 to D8.","Use the column letter first, then the row number. A range has a colon.","The cell is D5. The range is D2:D8."],["Sort and filter safely","Beginner",8,"Sorting changes the order of records. Filtering temporarily hides records that do not match a condition.","Sorting reorders records according to selected keys; filtering restricts the visible rows to records that satisfy criteria.","Sorting is like arranging bills from highest to lowest. Filtering is like looking only at bills from Chennai.","Sort Revenue: Largest to Smallest\nFilter City: Chennai","What does a filter do to rows that do not match?",["Deletes them permanently","Hides them from the current view","Moves them to another workbook"],1,"Filtering does not delete records. Clear the filter to see all rows again.","You need to see only paid invoices from Chennai, with the largest invoice at the top. Which two actions do you use?","First narrow the rows to Chennai and Paid, then order the remaining rows by Revenue descending.","Apply filters for City = Chennai and Status = Paid, then sort Revenue from Largest to Smallest."]],"SQL":[["Think in tables before writing SQL","Beginner",8,"A database keeps related information in organised tables. SQL is the language we use to ask those tables questions.","A relational database organises data into relations (tables) and provides a query language for retrieving and manipulating that data.","A shop can keep customer details in one register and orders in another, instead of repeating the customer's address on every bill.","customers table → customer details\norders table → purchases made\nSQL → questions asked of those tables","What is SQL mainly used for in data analysis?",["Designing slide decks","Asking questions of relational data","Drawing logos"],1,"SQL lets an analyst retrieve, filter, summarise and combine data stored in a database.","A shop has 10,000 customers and 80,000 orders. Why might it keep customers and orders in separate tables?","Think about repeated customer details and the risk of correcting the same detail in thousands of rows.","Separate tables reduce duplicated customer details. A customer ID can connect each order to the customer who placed it."],["Rows, columns and primary keys","Beginner",8,"A table has rows and columns. A primary key is a value that identifies one row uniquely.","A primary key is a column or set of columns whose values uniquely identify each tuple in a relational table.","An Order ID is like a ticket number. Two orders may have the same customer and amount, but each order needs its own identity.","orders\norder_id | customer_id | amount\n1001 | 7 | 1200\n1002 | 7 | 5400","Can customer_id be the primary key of an orders table if one customer can place many orders?",["Yes, because customers are important","No, because it can repeat","Only if it is a number"],1,"A primary key must be unique and not missing. A foreign key may repeat because it points to a row in another table.","In the example, which column should identify each order even when one customer places many orders?","Choose the value that is different for every order.","order_id is the primary key for orders. customer_id can repeat because one customer may have several orders."],["Read the shape of a SQL query","Beginner",8,"A basic SQL query says what columns you want, where to find them, and which rows to return.","The SELECT clause specifies expressions to return; FROM identifies the source relation.","It is like asking a librarian: show me these details from that particular register.","SELECT city, revenue\nFROM orders;","Which clause tells SQL where the data comes from?",["SELECT","FROM","ORDER BY"],1,"SELECT describes the output columns. FROM describes the source table or tables.","Read the query and say which word names the columns and which word names the table.","Look at the first line, then the second.","SELECT names city and revenue. FROM identifies the orders table."],["Your first SELECT query","Beginner",8,"Start with one table and ask for one or two columns. You do not need to learn every SQL keyword at once.","A projection selects specified attributes from a relation. In SQL, the projection list follows SELECT.","Instead of photocopying a whole register, you can request only the customer names you need.","SELECT name\nFROM customers;","Which query returns only the city column from customers?",["SELECT * FROM customers;","SELECT city FROM customers;","FROM customers SELECT city;"],1,"SELECT city returns one column. The asterisk (*) requests all columns.","Write a query that returns only the city column from the customers table.","Keep SELECT first, then the column name, then FROM and the table name.","SELECT city FROM customers;"]],"Python":[["What is Python?","Beginner",8,"Python is a programming language. You write instructions in Python, and the computer follows them in order.","Python is a high-level, general-purpose programming language commonly used for automation, data analysis, scripting and application development.","A recipe gives a cook ordered instructions. A program gives a computer ordered instructions.","Step 1: store a sales amount\nStep 2: calculate tax\nStep 3: display the total","What is a Python program?",["A set of instructions written for a computer","A type of spreadsheet cell","A database table"],0,"A program is a set of instructions. Python is one language used to write those instructions.","Describe one repetitive business task that could be automated with a short Python program.","Think of copying, checking, renaming or calculating something many times.","Examples include renaming hundreds of files, calculating monthly totals, checking missing values or preparing a repeated report."],["Run your first instruction: print()","Beginner",8,"The print() function displays information. It is one of the easiest ways to see what your program is doing.","print() is a built-in Python function that writes the string representation of supplied objects to the standard output stream.","It is like asking the computer to say something out loud on the screen.","print(\"Hello, DataTrail!\")\nprint(2 + 3)","What will print(2 + 3) display?",["23","5","2 + 3"],1,"Python evaluates the arithmetic expression first, then print() displays the result.","Write a Python instruction that displays the words Learning data analytics.","Use print, opening and closing brackets, and quotation marks around the words.","print(\"Learning data analytics\")"],["Text, numbers and True/False","Beginner",8,"Python treats text, numbers and yes/no values differently. These are different data types.","A data type defines the kind of value an object represents and the operations that can be performed on it.","A price is a number, a customer's name is text, and a paid/unpaid flag can be True or False.","customer = \"Asha\"   # string\norders = 12            # integer\nrevenue = 1499.50      # float\nis_paid = True         # boolean","Which value is a boolean?",["\"False\"","False","0.0"],1,"False without quotation marks is a boolean. \"False\" in quotation marks is text.","Classify these values: \"Chennai\", 2500, 3.5 and False.","Quotation marks indicate text. Whole numbers are integers; decimals are floating-point values.","\"Chennai\" is a string, 2500 is an integer, 3.5 is a float, and False is a boolean."],["Variables: give values a name","Beginner",8,"A variable is a name that stores a value so you can use it again later.","A variable is a symbolic name bound to an object in the program's execution environment.","A labelled jar stores sugar. A variable named revenue stores a value your program can reuse.","revenue = 15000\nexpenses = 8400\nprofit = revenue - expenses\nprint(profit)","Which line assigns the number 1200 to a variable named sales?",["sales == 1200","sales = 1200","1200 = sales"],1,"A single equals sign assigns a value. Two equals signs compare values.","Create a variable called sales with the value 1200, then display it.","Use the pattern name = value, then pass the name to print().","sales = 1200\nprint(sales)"]],"NumPy":[["Why analyse arrays?","Beginner",8,"Data analysts often work with hundreds or millions of numbers. NumPy gives Python efficient tools to work with numerical collections.","NumPy is a Python library providing multidimensional arrays and vectorised numerical operations.","A normal Python list is like a basket of items. A NumPy array is a numerical work surface designed for calculations across many values.","import numpy as np\nsales = np.array([120, 150, 90])\nprint(sales.mean())","What is NumPy especially designed to work with?",["Numerical arrays","PowerPoint slides","Web page layouts"],0,"NumPy is the foundation for efficient numerical work in Python and supports many scientific libraries.","A company wants to add 18% tax to 100,000 product prices. Why is an array useful?","Think about applying the same calculation to every value without writing a separate instruction for each one.","An array lets us apply one vectorised calculation to all prices efficiently and consistently."],["Import a library and give it an alias","Beginner",8,"A library is reusable code written by other developers. Import it when you need its tools.","An import statement binds a module or selected names into the current Python namespace; aliases provide shorter references.","Think of importing a toolkit before starting a repair job. The tools become available to use.","import numpy as np\nvalues = np.array([10, 20, 30])","What does the alias np represent?",["A new array","The NumPy package name used in shorter form","A Python data type"],1,"The alias is only a shorter name. It does not create a different library.","Write the standard import statement that lets you call NumPy using np.","The package name comes first, then as, then the short alias.","import numpy as np"],["Make a one-dimensional array","Beginner",8,"A one-dimensional array is a sequence of values arranged along one axis.","A one-dimensional ndarray has a single axis and a shape containing one length value.","It is like a single line of daily sales: Monday, Tuesday, Wednesday and so on.","import numpy as np\nsales = np.array([120, 150, 90, 200])\nprint(sales)","How many axes does a one-dimensional array have?",["Zero","One","Two"],1,"A one-dimensional array has one axis, even if that axis contains many values.","Create a NumPy array named prices containing 99, 149 and 199.","Use np.array() and place the three values inside square brackets.","prices = np.array([99, 149, 199])"],["Understand zero-based indexing","Beginner",8,"Python counts positions from zero. The first item is at index 0, not index 1.","Indexing accesses an array element by its integer position along an axis, using zero-based indexing.","A numbered row of lockers starts at locker 0 in programming, so position 1 means the second locker.","prices = np.array([99, 149, 199])\nprint(prices[0])  # 99\nprint(prices[1])  # 149","Which index selects the first element?",["0","1","-1"],0,"Index 0 selects the first element. Negative indices count backwards from the end.","Write an expression that returns the third item from prices.","The first item is index 0, so count 0, 1, 2.","prices[2]"]],"pandas":[["Why use pandas?","Beginner",8,"pandas helps you work with table-shaped data in Python. It is useful for cleaning, filtering, combining and summarising records.","pandas is a Python library providing labelled data structures and data-analysis operations, especially Series and DataFrame.","Imagine your Excel sales table, but now you can clean and analyse it using repeatable Python instructions.","import pandas as pd\ndf = pd.DataFrame({\"city\": [\"Chennai\", \"Pune\"], \"sales\": [1200, 900]})","What is pandas mainly used for?",["Analysing tabular data","Creating computer hardware","Designing logos"],0,"pandas provides practical structures and operations for preparing and analysing tabular data.","A CSV file contains 200,000 rows. Name two tasks pandas could help you perform.","Think about missing values, filtering, grouping or combining tables.","pandas can filter the rows and calculate summaries such as total sales by city. It can also help find missing or duplicate records."],["Create a DataFrame","Beginner",8,"A DataFrame is a table with rows and named columns. It is one of the main objects in pandas.","A DataFrame is a two-dimensional labelled data structure with potentially heterogeneous columns.","Think of an Excel worksheet with named columns. Each column contains one kind of information.","import pandas as pd\ndata = {\"city\": [\"Chennai\", \"Pune\"], \"sales\": [1200, 900]}\ndf = pd.DataFrame(data)","Which pandas object represents a two-dimensional table?",["Series","DataFrame","Index"],1,"A DataFrame is two-dimensional. A Series is one-dimensional.","Create a DataFrame from a dictionary with a product column containing Pen and Book.","Put the column name in quotes and its values inside a list.","df = pd.DataFrame({\"product\": [\"Pen\", \"Book\"]})"],["Inspect before analysing","Beginner",8,"Before calculating anything, look at the data. Check the first rows, number of rows and columns, and data types.","Data inspection profiles a dataset's structure, dimensions, inferred types and summary information before transformation or analysis.","Before cooking, you check the ingredients. Before analysing, you check the fields and values.","df.head()       # first 5 rows\ndf.shape        # rows and columns\ndf.info()       # data types and non-null counts","Which command quickly shows the first five rows?",["df.shape","df.head()","df.info()"],1,"head() previews records. shape gives dimensions. info() provides structural details.","Write the pandas command that shows the first five rows of df.","The function is called head and uses parentheses.","df.head()"],["Select one column","Beginner",8,"You can select a single DataFrame column by putting its name in square brackets.","Column selection returns a labelled Series when a single column label is provided.","It is like looking only at the Revenue column of a large sales register.","revenue = df[\"sales\"]\nprint(revenue.head())","What does df[\"city\"] return?",["The city column as a Series","The entire DataFrame","Only the first row"],0,"Selecting one column by its label usually returns a Series.","Select the city column from a DataFrame named df.","Use the DataFrame name followed by square brackets and the column name in quotes.","df[\"city\"]"]],"Statistics":[["What does statistics help us do?","Beginner",8,"Statistics helps us understand data. It turns many individual observations into useful summaries and evidence.","Statistics is the discipline concerned with collecting, organising, analysing, interpreting and presenting data.","Instead of reading every customer's bill one by one, a manager can study average order value, variation and trends.","Business question: Are average order values different between Chennai and Pune?","What is the main purpose of statistics?",["To make data easier to understand","To guarantee every prediction","To replace business questions"],0,"Statistics provides tools to summarise data and reason from evidence, while uncertainty and limitations still matter.","Write one question a business manager could answer by studying data instead of guessing.","Choose a question that involves comparing, counting, estimating or understanding change.","Examples: Which city has the highest sales? How much do orders usually cost? Did returns increase this month?"],["Categorical and numerical data","Beginner",8,"Some data describes groups, such as city or payment type. Other data measures amounts, such as revenue or age.","Categorical variables classify observations into groups; numerical variables represent counts or measurements.","A city is a label. Revenue is an amount. You can count cities, but calculating the average city name makes no sense.","City → categorical\nPayment method → categorical\nOrder amount → numerical\nNumber of orders → numerical count","Which variable is categorical?",["Monthly revenue","City","Number of orders"],1,"Categorical variables describe group membership. Numerical variables represent counts or measurements.","Classify customer age, city, membership tier and annual spending as categorical or numerical.","Ask whether the value is a label/group or a measurable quantity.","Age is numerical; city is categorical; membership tier is categorical; annual spending is numerical."],["Counts and percentages","Beginner",8,"A count tells how many records belong to a group. A percentage shows the group's share of the whole.","A proportion is a part divided by the total; multiplying the proportion by 100 expresses it as a percentage.","If 20 of 100 orders are refunded, the refund rate is 20%. The count is 20; the percentage gives context.","Refunded orders = 20\nAll orders = 100\nRefund rate = 20 / 100 × 100 = 20%","Why is a percentage often more useful than a count when comparing groups of different sizes?",["It accounts for different group sizes","It always proves a cause","It removes missing data"],0,"Percentages put groups on a common scale, but always check the denominator and how the percentage was calculated.","Out of 80 orders, 12 were refunded. Calculate the refund percentage.","Divide refunded orders by all orders, then multiply by 100.","12 ÷ 80 × 100 = 15%."],["Read a distribution before choosing an average","Beginner",8,"An average can describe a typical value, but a few unusually large or small values can pull it away from most records.","A distribution describes how values are spread; the mean is sensitive to extreme observations, whereas the median is more robust.","Five salaries might be close together, but one billionaire can make the mean look much larger than what most people earn.","Order values: 100, 120, 130, 150, 900\nMean = 280\nMedian = 130","Which measure is less affected by one extremely large value?",["Mean","Median","Both are equally affected"],1,"The median is resistant to extreme values. Always inspect the distribution before choosing a summary.","For the order values shown, which measure better represents a typical order: mean or median?","Most orders are near 100–150, while one order is much larger.","The median (130) is more representative of a typical order in this strongly right-skewed example."]],"Power BI":[["What is business intelligence?","Beginner",8,"Business intelligence turns business data into reports that help people make decisions.","Business intelligence (BI) encompasses processes and technologies for integrating, analysing and presenting information to support decision-making.","A sales manager should not need to open five spreadsheets to know how sales are doing. A dashboard brings the key evidence together.","Data sources → prepared data → model → measures → report → decision","What is the purpose of a BI report?",["To support decisions with data","To decorate a screen","To store passwords"],0,"A useful BI report answers a real business question with clearly defined and trustworthy measures.","A manager asks, 'Which region needs attention this month?' What information might help answer the question?","Think about sales, targets, change over time and the regions being compared.","A useful report could compare actual sales with target by region and show the monthly trend."],["Know the difference: data, model and report","Beginner",8,"Power BI has connected parts. Data is loaded and prepared, the model connects tables, and the report shows the results.","The Power BI workflow commonly separates data acquisition and transformation, semantic modelling, and report visualisation.","Think of building a house: materials are the data, the structure is the model, and the finished rooms are what people see in the report.","Data: orders.csv\nModel: Orders linked to Customers and Products\nReport: revenue cards, trends and region charts","Which part defines how tables relate to one another?",["Report page","Data model","Slicer"],1,"The semantic model defines tables, relationships and measures used by reports.","Put these in a sensible order: report, prepare data, build a model.","You need clean data before relationships, and a model before useful visuals.","Prepare data → build the model → create the report."],["Choose a visual for the question","Beginner",8,"Different charts answer different questions. A line chart shows change over time; a bar chart compares categories.","A visual encoding should match the analytical task and data types, supporting accurate comparisons and pattern recognition.","To compare cities, line up bars. To show monthly movement, connect points along a timeline.","Compare regions → bar chart\nMonthly trend → line chart\nShare of a small whole → use a carefully labelled part-to-whole visual","Which visual is usually best for a monthly trend?",["Line chart","Pie chart","Table with no sorting"],0,"Choose a visual based on the question, not decoration. Labels and scales must remain clear.","A manager wants to compare revenue across five cities. Choose a suitable visual and explain why.","The main task is comparing categories, not following a timeline.","A bar or column chart is suitable because it makes differences between city values easy to compare."],["Start with a business question and KPI","Beginner",8,"A KPI is a measure that helps track progress toward a business goal. Decide what question matters before building a dashboard.","A key performance indicator is a quantifiable measure linked to an objective, with a defined calculation and reporting context.","If the goal is to grow sales, total revenue may matter. If the goal is to keep customers, retention may matter more.","Goal: improve monthly sales\nKPI: monthly revenue\nContext: compare with last month and target","What should come before choosing dashboard visuals?",["A business question and objective","A colour palette","A 3D chart"],0,"Start with the decision and define the metric carefully before designing the page.","For a business trying to reduce late deliveries, suggest one useful KPI.","The KPI should measure the outcome the business wants to improve.","Examples include late-delivery rate or percentage of orders delivered on time, with a clear denominator."]]};

let state=load();
function load(){
try{
let raw=localStorage.getItem(STORE),legacy=false;
if(!raw){raw=localStorage.getItem("datatrail-v1");legacy=!!raw}
let saved=raw?JSON.parse(raw):{};
if(legacy){
const shift=id=>{let m=/^(excel|sql|python|numpy|pandas|statistics|powerbi)-(\d+)$/.exec(id||"");return m?m[1]+"-"+(Number(m[2])+4):id};
saved.done=(saved.done||[]).map(shift);
saved.bookmarks=(saved.bookmarks||[]).map(shift);
if(saved.answers)saved.answers=Object.fromEntries(Object.entries(saved.answers).map(([k,v])=>[shift(k),v]));
}
let base={done:[],xp:0,streak:0,lastDay:"",answers:{},bookmarks:[],projects:{},practiceNotes:{},dailyMinutes:0,preferences:{daily:45,goal:"Data analyst job",level:"Complete beginner"},hasOnboarded:false};
let merged=Object.assign(base,saved);
if(!merged.practiceNotes)merged.practiceNotes={};
if(legacy)localStorage.setItem(STORE,JSON.stringify(merged));
return merged
}catch(e){return {done:[],xp:0,streak:0,lastDay:"",answers:{},bookmarks:[],projects:{},practiceNotes:{},dailyMinutes:0,preferences:{daily:45,goal:"Data analyst job",level:"Complete beginner"},hasOnboarded:false}}
}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){toast("Browser storage is unavailable. Export a backup to keep progress.")}updateXp()}
function updateXp(){let x=document.getElementById("xp");if(x)x.textContent=(state.xp||0)+" XP"}
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function allLessons(){return tracks.flatMap(t=>t.lessons.map(l=>Object.assign({track:t.name},l)))}
function doneCount(){return state.done.length}
function pct(){return Math.round(doneCount()/allLessons().length*100)}
function today(){return new Date().toISOString().slice(0,10)}
function recordStudy(){let d=today();if(state.lastDay!==d){state.streak=state.lastDay===new Date(Date.now()-86400000).toISOString().slice(0,10)?(state.streak||0)+1:1;state.lastDay=d;state.dailyMinutes=0}state.dailyMinutes=(state.dailyMinutes||0)+5;save()}

function dashboard(){

function statsLab(){
view.innerHTML='<div class="eyebrow">STATISTICS MINI LAB</div><h1 class="h1">Make numbers tell a story.</h1><p class="sub">Paste a list of numbers and explore the summary. These are descriptive calculations, not a substitute for checking assumptions in a full analysis.</p><div class="grid two" style="margin-top:20px"><div class="card"><div class="eyebrow">YOUR DATA</div><p class="tiny muted">Example: daily sales or order amounts, separated by commas.</p><textarea id="statData" class="field" style="min-height:100px" >1200, 900, 1500, 3200, 2100, 5400</textarea><button class="btn primary" id="calcStats" style="margin-top:12px">Calculate statistics</button></div><div class="card"><div class="eyebrow">WHAT TO LOOK AT</div><div class="grid two" id="statResults"><div><div class="tiny muted">Mean</div><div class="metric">—</div></div><div><div class="tiny muted">Median</div><div class="metric">—</div></div><div><div class="tiny muted">Mode</div><div class="metric">—</div></div><div><div class="tiny muted">Std. deviation</div><div class="metric">—</div></div><div><div class="tiny muted">Minimum</div><div class="metric">—</div></div><div><div class="tiny muted">Maximum</div><div class="metric">—</div></div></div></div></div><div class="card" style="margin-top:15px"><div class="eyebrow">INTERPRETATION PRACTICE</div><h3 style="font-size:15px">A test returns p = 0.03. Your significance level is 0.05.</h3><p class="tiny muted">What is the usual statistical decision?</p><button class="option" data-stat="1">Reject the null hypothesis at the 5% significance level.</button><button class="option" data-stat="0">There is a 3% probability that the null hypothesis is true.</button><div id="statInterpret"></div></div>';
document.getElementById("calcStats").onclick=calcStats;calcStats();view.querySelectorAll("[data-stat]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-stat]").forEach(x=>x.classList.remove("correct","wrong"));let yes=b.dataset.stat==="1";b.classList.add(yes?"correct":"wrong");document.getElementById("statInterpret").innerHTML='<div class="feedback">'+(yes?"Correct. ":"Not quite. ")+"Because p (0.03) is below alpha (0.05), the result is statistically significant under the test assumptions. A p-value is not the probability that H0 is true.</div>";})
}
function calcStats(){let vals=document.getElementById("statData").value.split(/[,\s]+/).map(Number).filter(Number.isFinite);if(!vals.length){toast("Enter at least one number.");return}let sorted=vals.slice().sort((a,b)=>a-b),mean=vals.reduce((a,b)=>a+b,0)/vals.length,median=sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2,counts={};vals.forEach(v=>counts[v]=(counts[v]||0)+1);let maxCount=Math.max(...Object.values(counts)),modes=Object.keys(counts).filter(k=>counts[k]===maxCount&&maxCount>1).join(", ")||"No repeated value",sd=Math.sqrt(vals.reduce((a,b)=>a+Math.pow(b-mean,2),0)/vals.length);document.getElementById("statResults").innerHTML=[["Mean",mean],["Median",median],["Mode",modes],["Std. deviation",sd],["Minimum",Math.min(...vals)],["Maximum",Math.max(...vals)]].map(x=>'<div><div class="tiny muted">'+x[0]+'</div><div class="metric" style="font-size:20px">'+(typeof x[1]==="number"?x[1].toFixed(2):esc(x[1]))+'</div></div>').join("")}

enue and growth KPI cards</label><label class="check"><input type="checkbox" value="trend"> Monthly sales trend</label><label class="check"><input type="checkbox" value="region"> Region comparison</label><label class="check"><input type="checkbox" value="3d"> Decorative 3D spinning logo</label></div><button class="btn primary" id="checkPbi">Check my design</button><div id="pbiFeedback"></div></div>';

view.innerHTML='<div class="eyebrow">YOUR LEARNING RECORD</div><h1 class="h1">Look how far you have come.</h1><p class="sub">Your learning record is saved locally in this browser. Export a backup before changing devices or browsers.</p><div class="grid four" style="margin-top:20px"><div class="card"><div class="tiny muted">Overall progress</div><div class="metric">'+pct()+'%</div></div><div class="card"><div class="tiny muted">Lessons completed</div><div class="metric">'+doneCount()+'</div></div><div class="card"><div class="tiny muted">XP earned</div><div class="metric">'+state.xp+'</div></div><div class="card"><div class="tiny muted">Current streak</div><div class="metric">'+state.streak+'</div></div></div><div class="sectionhead"><div><h2>Progress by subject</h2><p>Small improvements build up.</p></div></div><div class="card">'+tracks.map(t=>'<div style="margin:13px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px"><strong>'+t.name+'</strong><span class="muted">'+t.lessons.filter(l=>state.done.includes(l.id)).length+'/'+t.lessons.length+'</span></div><div class="progress"><span style="width:'+t.lessons.filter(l=>state.done.includes(l.id)).length/t.lessons.length*100+'%"></span></div></div>').join("")+'</div><div class="sectionhead"><div><h2>Saved lessons</h2><p>Bookmarks to revisit.</p></div></div><div class="card">'+(state.bookmarks.length?allLessons().filter(l=>state.bookmarks.includes(l.id)).map(l=>'<div class="lessonrow" data-saved="'+l.id+'" data-track="'+l.track+'"><div class="number">★</div><div><h4>'+esc(l.title)+'</h4><p>'+l.track+'</p></div></div>').join(""):'<div class="empty">No saved lessons yet. Bookmark a lesson to keep it here.</div>')+'</div><div class="sectionhead"><div><h2>Backup and settings</h2><p>Data stays in this browser unless you export it.</p></div></div><div class="card"><div class="pillrow"><button class="btn primary" id="exportProgress">Export progress JSON</button><label class="btn" for="importProgress" style="display:inline-flex;align-items:center">Import progress JSON</label><input type="file" id="importProgress" accept="application/json" hidden><button class="btn" id="resetProgress">Reset progress</button></div><p class="tiny muted" style="margin-top:12px">Export includes completed lessons, quiz attempts, bookmarks, project milestones and XP. Keep the JSON file private if it contains personal notes.</p></div>';
