const advancedModules = {"Excel":[["Dynamic arrays: FILTER, SORT and UNIQUE","Advanced",18,"Dynamic array formulas return a set of results that spill into neighbouring cells. They can replace many copied formulas.","Dynamic array functions return arrays that spill into adjacent cells when the output range is available.","Instead of manually copying a list of unique cities, ask Excel to create the whole list and keep it updated.","=SORT(UNIQUE(B2:B100))\n=FILTER(A2:D100,D2:D100=\"Paid\",\"No matches\")","What happens when a dynamic array formula returns 10 values?",["The results spill into adjacent cells","Excel creates 10 separate workbooks","Only the first result is kept"],0,"The formula occupies one anchor cell and its result spills into the required adjacent cells.","Create a sorted list of unique cities from B2:B100.","UNIQUE removes duplicates; SORT orders the returned array.","=SORT(UNIQUE(B2:B100))"],["Power Query: repeatable data cleaning","Advanced",18,"Power Query imports and transforms data through repeatable steps. It is useful when the same messy monthly files arrive again and again.","Power Query is an ETL tool: it extracts data, transforms it through recorded steps, and loads the result to a destination.","Instead of cleaning every monthly sales file by hand, build the cleaning recipe once and refresh it when a new file arrives.","let\n    Source = Excel.CurrentWorkbook(){[Name=\"Sales\"]}[Content],\n    CleanCity = Table.TransformColumns(Source, {{\"City\", Text.Trim}}),\n    PaidOnly = Table.SelectRows(CleanCity, each [Status] = \"Paid\")\nin\n    PaidOnly","Why is a saved Power Query transformation more reliable than repeating manual cleaning every month?",["It records repeatable steps that can be refreshed","It removes the need to inspect the result","It guarantees source data is always correct"],0,"Repeatable transformation steps reduce manual variation, but the analyst still needs to validate the output.","Describe a repeatable Power Query workflow for monthly invoice files.","Think: connect, clean, set data types, filter or combine, then load and validate.","Connect to the source files, promote headers, set correct data types, trim text, handle errors and duplicates, combine files if required, load the result and check row counts and totals."],["LET and LAMBDA: build reusable formulas","Advanced",18,"LET gives names to parts of a formula. LAMBDA lets you define a reusable custom function without writing VBA.","LET binds names to intermediate calculations within a formula; LAMBDA defines reusable functions using Excel formula syntax.","LET is like naming ingredients before mixing them. LAMBDA is like writing a reusable recipe card.","=LET(revenue,C2,margin,D2,revenue*margin)\n=LAMBDA(price,qty,price*qty)(120,3)","What is the main benefit of LET in a long formula?",["It names intermediate calculations and can avoid repeating expressions","It changes the workbook theme","It creates a database connection"],0,"Named intermediate values make formulas easier to read, maintain and sometimes calculate more efficiently.","Write a LET formula that names A2 as price and B2 as quantity, then calculates their product.","Use LET(name,value,calculation).","=LET(price,A2,quantity,B2,price*quantity)"],["Excel Data Model and relationships","Advanced",18,"When data comes from multiple business tables, the Data Model lets you relate them and build PivotTables without flattening everything into one enormous sheet.","The Excel Data Model is an in-memory relational model that supports relationships between tables and measures used by PivotTables.","Keep customer details in Customers and transactions in Sales. Connect them with CustomerID rather than repeating every customer detail in every sale row.","Customers[CustomerID] 1 ─── * Sales[CustomerID]\nTotal Revenue := SUM(Sales[Revenue])","Which relationship is typical between a Customers dimension and a Sales fact table?",["One customer to many sales rows","Many customers to one customer row","One-to-one for every sale"],0,"A customer can make many purchases, so the customer key normally appears once in the dimension and many times in the fact table.","Explain why a Data Model is preferable to copying customer city and segment into every sales row.","Think about duplication, update anomalies, table size and reusable analysis.","A Data Model stores customer attributes once, relates Sales by CustomerID, and supports consistent slicing and aggregation without duplicating descriptive fields."]],"SQL":[["Subqueries and EXISTS","Advanced",18,"A subquery is a query nested inside another query. It can produce a list, a single value or a yes/no test for the outer query.","A subquery is a nested SELECT statement. EXISTS tests whether the correlated subquery returns at least one row.","Ask for customers who have at least one paid order. The inner query checks their orders; the outer query returns the customer.","SELECT c.customer_id, c.name\nFROM customers c\nWHERE EXISTS (\n  SELECT 1\n  FROM orders o\n  WHERE o.customer_id = c.customer_id\n    AND o.status = 'Paid'\n);","What does EXISTS test?",["Whether the subquery returns at least one row","Whether the subquery returns exactly one column","Whether every value is unique"],0,"EXISTS is a Boolean existence test. The values selected inside the subquery are usually irrelevant.","Write a query to return customers who have at least one order above 5000.","Correlate orders.customer_id to customers.customer_id and put amount > 5000 inside EXISTS.","SELECT c.customer_id, c.name FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id AND o.amount > 5000);"],["Window frames, LAG and running totals","Advanced",18,"Window functions calculate across related rows while keeping each original row. A frame controls which neighbouring rows contribute.","A window frame specifies the subset of rows within a window partition used by a window aggregate for the current row.","To show each order and the customer's running spend, keep every order row but accumulate earlier orders for that customer.","SELECT customer_id, order_date, amount,\n       SUM(amount) OVER (\n         PARTITION BY customer_id\n         ORDER BY order_date\n         ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n       ) AS running_spend,\n       LAG(amount) OVER (\n         PARTITION BY customer_id ORDER BY order_date\n       ) AS previous_order\nFROM orders;","Which clause resets the running total for each customer?",["PARTITION BY customer_id","LIMIT","GROUP BY amount"],0,"PARTITION BY creates independent windows for each customer. ORDER BY defines sequence, and the frame defines the cumulative rows.","Write a running total of amount by customer, ordered by order_date.","Use SUM(amount) OVER, then PARTITION BY, ORDER BY and the cumulative ROWS frame.","SUM(amount) OVER (PARTITION BY customer_id ORDER BY order_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)"],["Query performance: indexes and query plans","Advanced",18,"A query that returns the right answer can still be slow. Query plans and indexes help you understand how a database finds rows.","An index is a data structure that can reduce row lookup cost. EXPLAIN or EXPLAIN QUERY PLAN exposes the strategy a database uses to execute a statement.","An index is like the index at the back of a book: it helps locate relevant pages without scanning every page.","CREATE INDEX idx_orders_customer_date\nON orders(customer_id, order_date);\n\nEXPLAIN QUERY PLAN\nSELECT * FROM orders\nWHERE customer_id = 42\nORDER BY order_date;","Why should you inspect a query plan before adding many indexes?",["The plan shows whether an index or scan is actually used","Every index always makes every query faster","Indexes eliminate the need for correct joins"],0,"Indexes improve some access patterns but add storage and write overhead. Use the plan and workload to make a measured choice.","Describe two ways to investigate a slow query before changing the schema.","Check row counts and the execution plan; inspect joins, filters, selected columns and sort operations.","Inspect the execution plan, test selective filters and join keys, reduce unnecessary columns, confirm indexes match the predicates and ordering, and benchmark before and after."],["Data quality: NULLs, duplicates and deterministic deduplication","Advanced",18,"Real datasets contain missing values and duplicate records. Clean them with explicit rules, not by deleting rows blindly.","Data-quality validation checks uniqueness, completeness, referential integrity and domain constraints. Window functions can rank candidate duplicates deterministically.","Two identical-looking orders may be accidental duplicates—or two genuine purchases. Define which fields identify a duplicate before removing anything.","WITH ranked AS (\n SELECT *, ROW_NUMBER() OVER (\n   PARTITION BY customer_id, order_date, amount\n   ORDER BY order_id\n ) AS rn\n FROM orders\n)\nSELECT * FROM ranked WHERE rn = 1;","What must be decided before deduplicating records?",["Which columns define a duplicate and which record to retain","Which rows have the smallest amount","Which table has the longest name"],0,"Deduplication is a business rule. Define the natural key and retention rule before applying ROW_NUMBER.","Propose a duplicate rule for order data and explain how you would check for NULL customer IDs.","Use GROUP BY or ROW_NUMBER to identify duplicates, and IS NULL to inspect missing keys.","Define the business key, count duplicates by that key, inspect examples, rank rows with ROW_NUMBER using a deterministic tie-breaker, retain the approved row, and separately report rows where customer_id IS NULL."]],"Python":[["Project environments and dependency control","Advanced",18,"A professional Python project should record which packages and versions it needs. A virtual environment keeps one project's dependencies separate from another's.","A virtual environment isolates a project's Python interpreter environment and installed packages from the global environment.","Keep each project in its own toolbox so that changing one project's tools does not break another project.","python -m venv .venv\n# macOS / Linux\nsource .venv/bin/activate\npython -m pip install pandas\npython -m pip freeze > requirements.txt","What problem does a virtual environment mainly solve?",["It isolates project dependencies","It makes every script run without bugs","It stores the dataset in RAM"],0,"Isolation reduces dependency conflicts and makes project setup easier to reproduce.","Write the typical command sequence to create and activate a virtual environment on macOS or Linux.","Create it with python -m venv .venv, then activate the bin/activate script.","python -m venv .venv\nsource .venv/bin/activate"],["JSON and API-shaped data","Advanced",18,"Many business systems expose data as JSON. Python can parse JSON text into dictionaries and lists that you can inspect and transform.","JSON is a text-based data interchange format. Python's json module serialises and deserialises JSON values into native Python structures.","JSON is like a labelled parcel: keys name each field, and values hold the information.","import json\npayload = '{\"order_id\": 1001, \"amount\": 1200}'\norder = json.loads(payload)\nprint(order[\"amount\"])","What Python object does json.loads() return for a JSON object?",["A dictionary","A pandas DataFrame","A Python class definition"],0,"JSON objects become Python dictionaries, arrays become lists, strings become strings, numbers become numeric values and true/false become booleans.","Parse a JSON string containing a city and revenue, then print the revenue value.","Call json.loads(), assign the returned dictionary, then access the revenue key.","import json\npayload = '{\"city\": \"Chennai\", \"revenue\": 1200}'\nrecord = json.loads(payload)\nprint(record[\"revenue\"])"],["Defensive functions and input validation","Advanced",18,"Reusable analysis functions should check their inputs and fail clearly when assumptions are broken.","Input validation enforces preconditions and raises explicit exceptions when callers provide values outside the function's contract.","A good measuring instrument tells you when it cannot give a reliable reading instead of quietly showing a misleading number.","def average(values: list[float]) -> float:\n    if not values:\n        raise ValueError(\"values cannot be empty\")\n    return sum(values) / len(values)","Why is raising ValueError for an empty list better than silently returning zero?",["Zero could be mistaken for a real average","It makes the code shorter","It automatically removes outliers"],0,"An empty collection has no arithmetic mean. An explicit exception prevents an invalid result from being interpreted as a genuine measurement.","Write one validation rule for a function that accepts a discount rate.","Check whether the rate is numeric and lies between 0 and 1 before calculating.","if not 0 <= discount_rate <= 1:\n    raise ValueError(\"discount_rate must be between 0 and 1\")"],["Profile before optimising","Advanced",18,"Do not guess which part of a program is slow. Measure it, find the bottleneck, then improve the section that matters.","Profiling measures execution time or resource use to identify bottlenecks. Vectorisation and algorithmic changes can reduce repeated interpreter overhead.","Do not rebuild the whole kitchen because one oven is slow. Measure which stage is taking the time.","from timeit import timeit\n\nvalues = list(range(100_000))\nloop_time = timeit(\"sum([x*x for x in values])\", globals=globals(), number=20)\nprint(loop_time)","What should you do before optimising a data-processing script?",["Measure and identify the bottleneck","Rewrite everything in a new language","Add more print statements everywhere"],0,"Profiling provides evidence about where time is spent and prevents unnecessary complexity.","Describe a safe workflow for improving a slow pandas or Python calculation.","Capture a baseline, profile, change one bottleneck, then compare output correctness and timings.","Create a reproducible input, measure baseline time, profile the slow section, test a targeted improvement such as vectorisation or a better algorithm, then verify identical results and re-measure."]],"NumPy":[["Advanced indexing and np.where","Advanced",18,"Advanced indexing selects groups of values using integer arrays or Boolean masks. np.where can choose values based on a condition.","Advanced indexing uses integer or Boolean index arrays. np.where(condition, x, y) performs element-wise conditional selection.","Instead of checking each product price one by one, apply one condition to the whole array.","prices = np.array([80, 120, 250, 90])\nmask = prices >= 100\npremium = prices[mask]\nlabels = np.where(prices >= 100, \"Premium\", \"Standard\")","What does prices[prices >= 100] return?",["All values meeting the condition","The positions of every value","The mean of the array"],0,"A Boolean mask has the same shape as the tested array and selects values where the mask is True.","Use np.where to label sales values above 1000 as High and the rest as Regular.","Pass the comparison first, then the high and low result labels.","np.where(sales > 1000, \"High\", \"Regular\")"],["Views, copies and memory behaviour","Advanced",18,"Some NumPy operations return a view that refers to the same underlying data. Others create a copy. Confusing them can cause accidental changes.","A view is an array object that shares memory with another array; a copy owns separate data.","A view is like another window looking at the same document. A copy is a separate duplicate.","base = np.array([10, 20, 30, 40])\nview = base[1:3]\ncopy = base[1:3].copy()\nview[0] = 999\nprint(base)  # changed","What happens when you modify a slice that is a view?",["The original array may change","The original array is always protected","Python automatically creates a backup"],0,"Slicing commonly returns a view. Use .copy() when independent data is required.","Write code to create an independent copy of the first five elements of values.","Slice first, then call .copy().","independent = values[:5].copy()"],["Reproducible random simulations","Advanced",18,"Random sampling is useful for simulations and testing. Use NumPy's Generator API and a fixed seed when you need results to be reproducible.","numpy.random.default_rng creates a Generator that provides random-number methods using an explicit bit generator.","A fixed seed is like starting a shuffled deck from the same starting state so your experiment can be repeated.","rng = np.random.default_rng(42)\nsample = rng.normal(loc=100, scale=15, size=1000)\nprint(sample.mean())","Why is a fixed random seed useful in a reproducible analysis?",["It lets another run recreate the same pseudo-random sequence","It guarantees the sample represents the population","It removes sampling error"],0,"Seeded pseudo-random generators allow the same sequence to be recreated. They do not make a sample unbiased or representative.","Create a Generator with seed 7 and draw five integers from 1 to 10 inclusive.","Use default_rng(7), then integers(1, 11, size=5).","rng = np.random.default_rng(7)\nvalues = rng.integers(1, 11, size=5)"],["Numerical workflow: shape, dtype and vectorisation","Advanced",18,"Reliable numerical analysis depends on checking array shape and data type before combining arrays or interpreting results.","Shape compatibility, dtype selection and vectorised operations determine whether array expressions are valid, efficient and numerically appropriate.","Before connecting two pipes, check their sizes. Before combining arrays, check their shapes.","a = np.array([[1, 2, 3], [4, 5, 6]], dtype=np.float64)\nb = np.array([10, 20, 30])\nresult = a + b\nprint(result.shape)  # (2, 3)","What shape is required for b to broadcast across every row of a with shape (2, 3)?",["(3,)","(2,)","(4, 4)"],0,"A one-dimensional array of length three aligns with the last dimension of the 2×3 array.","Explain why checking dtype matters when doing financial calculations with decimal values.","Think about integer truncation, floating-point representation and precision requirements.","Inspect dtypes before calculation. Avoid integer storage for fractional results, understand floating-point precision limits, and use decimal arithmetic or integer minor currency units where exact monetary representation is required."]],"pandas":[["Auditable joins with merge validation","Advanced",18,"A merge can multiply rows if the lookup table has duplicate keys. Validate the expected relationship instead of assuming it is correct.","pandas.merge supports cardinality validation such as one_to_one and many_to_one, plus an indicator column that identifies matched and unmatched rows.","Joining sales to a customer master should not turn one sale into three sales just because the customer master has duplicate IDs.","joined = orders.merge(\n    customers,\n    on=\"customer_id\",\n    how=\"left\",\n    validate=\"many_to_one\",\n    indicator=True\n)\nprint(joined[\"_merge\"].value_counts())","What does validate=\"many_to_one\" assert?",["The right-side join key is unique for each match","Both tables must have the same row count","Every order must match exactly once"],0,"It asserts many rows on the left may match one row on the right. A violated assumption raises an error rather than silently multiplying rows.","Write a left merge of orders to customers on customer_id and validate a many-to-one relationship.","Use merge with how=\"left\" and validate=\"many_to_one\".","orders.merge(customers, on=\"customer_id\", how=\"left\", validate=\"many_to_one\")"],["GroupBy: agg, transform and filter","Advanced",18,"GroupBy can produce one summary row per group, return a value aligned to every original row, or keep entire groups that meet a condition.","agg reduces groups; transform returns group-level results aligned to the original index; filter retains or discards whole groups based on a group predicate.","agg gives one report line per city. transform writes each city's total beside every order from that city.","city_totals = df.groupby(\"city\")[\"sales\"].transform(\"sum\")\ndf[\"city_total\"] = city_totals\nsummary = df.groupby(\"city\")[\"sales\"].agg([\"sum\", \"mean\", \"count\"])","When would transform be more appropriate than agg?",["When each original row needs its group's statistic","When you want only one row per group","When you want to delete duplicates"],0,"transform returns a same-indexed result, making it useful for group-level features on row-level data.","Add each customer's average order amount to every row for that customer.","Group by customer_id and use transform(\"mean\") on amount.","df[\"customer_avg_order\"] = df.groupby(\"customer_id\")[\"amount\"].transform(\"mean\")"],["Time series: resample, rolling and shift","Advanced",18,"Time-series data must be ordered by time. Resampling changes the time frequency, rolling calculates moving windows, and shift compares with earlier periods.","pandas resample aggregates time-indexed observations to a new frequency; rolling computes window statistics; shift aligns lagged values.","Resample creates monthly totals from daily sales. Rolling gives a moving average. Shift lets you compare this month with last month.","df[\"date\"] = pd.to_datetime(df[\"date\"])\ndf = df.set_index(\"date\").sort_index()\nmonthly = df[\"sales\"].resample(\"ME\").sum()\nma_3 = monthly.rolling(3).mean()\nprevious = monthly.shift(1)","What must be true before using time-based resample on a DataFrame column?",["The date column must be a datetime-like index or specified time key","The rows must be alphabetically sorted by city","Every value must be unique"],0,"Resampling relies on a datetime-like index or an explicit time column with the appropriate API.","Describe how to calculate monthly total revenue and compare it with the previous month.","Convert to datetime, set or specify the time index, resample to month-end totals, then use shift(1).","Convert dates with pd.to_datetime, sort and set the date index, calculate monthly sums with resample(\"ME\").sum(), then compare with monthly.shift(1)."],["Large datasets: memory and chunked reads","Advanced",18,"Large files can exhaust memory. Read only useful columns, choose sensible data types, use categories for repeated labels, or process the file in chunks.","Memory-efficient ingestion reduces loaded columns and precision, uses categorical encodings where appropriate, and streams chunks rather than materialising the full dataset.","Do not carry every box into a room when you only need three. Load only the fields and rows required for the analysis.","df = pd.read_csv(\n    \"orders.csv\",\n    usecols=[\"date\", \"city\", \"amount\"],\n    parse_dates=[\"date\"],\n    dtype={\"city\": \"category\"},\n    chunksize=100_000\n)\nfor chunk in df:\n    print(chunk[\"amount\"].sum())","Which option helps process a file that is too large to load all at once?",["chunksize","head(5)","to_string()"],0,"chunksize returns an iterator of manageable DataFrame chunks. The analyst must combine or accumulate results carefully.","Give two ways to reduce memory use when reading a large CSV.","Consider usecols, efficient dtypes, category for repeated labels and chunked reading.","Read only the required columns, specify sensible dtypes (including category for repeated labels), parse dates deliberately, and use chunksize for streaming aggregation."]],"Statistics":[["Choose the right statistical test","Advanced",18,"Do not choose a test by memorising its name. Start with the business question, outcome type, number of groups, pairing, sample design and assumptions.","Test selection depends on the estimand, variable measurement scale, independence structure, distributional assumptions and sampling design.","To compare average bills between two separate cities is a different question from checking whether the same customers spend more after a campaign.","Two independent means → independent-samples t-test (often Welch)\nSame people before and after → paired t-test\nAssociation between categories → chi-square test","Which design calls for a paired analysis?",["Comparing sales from two unrelated stores","Measuring the same customers before and after a change","Comparing three unrelated cities"],1,"Paired analyses use within-unit differences because the observations are linked.","Choose a suitable test for whether the same 30 customers changed their spending after a loyalty programme.","Identify that the same customers are measured twice. Analyse their paired differences.","A paired t-test is a starting choice for mean within-customer change when the difference scores meet its assumptions. Consider a nonparametric alternative when those assumptions are unsuitable."],["Independent, paired and Welch t-tests","Advanced",18,"A t-test compares means. The design decides which version is appropriate. Welch's test does not assume equal population variances.","Independent t-tests compare means from unrelated groups; paired t-tests analyse within-pair differences; Welch's t-test adjusts degrees of freedom for unequal variances.","Compare two different groups with an independent test. Compare the same people twice with a paired test.","Welch independent test: two unrelated groups, potentially unequal variances\nPaired test: compute difference for each matched pair, then test the mean difference","What is the key input to a paired t-test?",["The difference within each pair","The pooled total of both groups","The largest observation only"],0,"The paired test operates on within-pair differences, preserving the link between measurements.","Explain why treating pre-test and post-test scores from the same people as independent can be misleading.","The two measurements share a person and are correlated. The analysis should account for this pairing.","Pairing uses each person's own baseline and follow-up, usually reducing irrelevant between-person variation. An independent test incorrectly treats the paired observations as unrelated."],["Chi-square tests for categorical association","Advanced",18,"A chi-square test can assess whether two categorical variables are associated. It compares observed counts with counts expected under independence.","The Pearson chi-square test compares observed cell frequencies to expected frequencies under a null model of independence.","Ask whether payment method is associated with order status. The test compares the actual table of counts with what independence would predict.","Observed contingency table:\n           Paid  Pending\nUPI          40      10\nCard         30      20\n\nH0: payment method and order status are independent.","What type of data does a chi-square test of independence use?",["Counts in categories","Averages of continuous scores","Ranks from a time series"],0,"The test uses frequency counts in a contingency table. Expected cell counts and sampling assumptions should be checked.","A retailer wants to test whether payment method is associated with order status. What should be tabulated first?","Create one row per payment method and one column per order status, then count orders in each cell.","Build a contingency table of observed counts for payment method × order status. Calculate expected counts under independence and check whether the chi-square approximation is appropriate."],["Regression: association, prediction and confounding","Advanced",18,"Regression models relationships between variables. A coefficient describes an adjusted association under the model; it does not automatically prove causation.","Linear regression estimates conditional mean relationships under specified assumptions. Confounding occurs when a third variable influences both the predictor and outcome.","Umbrella sales and rain may rise together, but umbrellas do not cause rain. The weather is a common cause.","sales = β0 + β1 × advertising_spend + error\nInterpret β1 in the units of the model, conditional on included predictors.","What does a regression coefficient by itself establish?",["A model-based association, not automatic causation","Proof that the predictor caused the outcome","That all omitted variables are irrelevant"],0,"Regression coefficients are interpreted within the model and study design. Causal claims need a defensible identification strategy.","Name one possible confounder when studying the relationship between advertising spend and sales.","Think of seasonality, promotions, price changes or market demand influencing both.","Seasonality or a major promotion could affect both advertising spend and sales. Measure and account for plausible confounders, inspect residuals and avoid causal language without an appropriate design."]],"Power BI":[["CALCULATE and filter context","Advanced",18,"CALCULATE evaluates a measure after changing the filters that apply. It is one of the most important ideas in DAX.","CALCULATE evaluates an expression in a modified filter context by adding, replacing or removing filters according to its filter arguments.","Imagine a report currently showing every city. CALCULATE can ask the same revenue measure to show only Chennai.","Total Revenue = SUM(Sales[Revenue])\n\nChennai Revenue =\nCALCULATE(\n    [Total Revenue],\n    Customer[City] = \"Chennai\"\n)","What does CALCULATE primarily modify?",["The filter context for an expression","The physical order of rows in the source file","The report page size"],0,"CALCULATE evaluates its expression under a modified filter context. The result changes according to the filters applied.","Write a measure for revenue from the Online channel using CALCULATE.","Use the base measure as the first argument and a filter on Sales[Channel] as the second.","Online Revenue = CALCULATE([Total Revenue], Sales[Channel] = \"Online\")"],["Row context, filter context and iterators","Advanced",18,"Row context means DAX is evaluating one row at a time. Filter context means the set of filters affecting the calculation. Iterator functions such as SUMX create row context.","Iterators evaluate an expression for each row of a table and aggregate the results. Context transition occurs when CALCULATE converts row context into filter context.","SUM adds a stored column. SUMX can calculate quantity times unit price for each row, then add those row results.","Line Revenue =\nSUMX(\n    Sales,\n    Sales[Quantity] * Sales[UnitPrice]\n)","Why use SUMX instead of SUM when revenue is not stored as a column?",["SUMX evaluates an expression for each sales row","SUMX automatically fixes incorrect relationships","SUMX removes all report filters"],0,"SUMX iterates over the Sales table and evaluates quantity × unit price for each row under the current context.","Write a measure that calculates total cost by summing Quantity × UnitCost for every row.","Use SUMX over Sales and multiply the two columns inside it.","Total Cost = SUMX(Sales, Sales[Quantity] * Sales[UnitCost])"],["Time intelligence with a proper date table","Advanced",18,"Year-to-date and prior-year measures rely on a reliable date table and a correct relationship to the fact table.","Time-intelligence functions operate over a contiguous date dimension with appropriate relationships and model configuration.","A calendar gives every sale a consistent day, month, quarter and year, even when some dates have no transactions.","Sales YTD = TOTALYTD([Total Revenue], 'Date'[Date])\n\nPrior Year Sales =\nCALCULATE(\n    [Total Revenue],\n    SAMEPERIODLASTYEAR('Date'[Date])\n)","What is a key requirement for reliable standard time-intelligence calculations?",["A proper contiguous date table related to the fact table","A pie chart on every page","A separate table for each month"],0,"A date table should have one row per date, cover the analysis period, and be related to the date key in the fact table.","Explain why using the date from a transaction table can cause gaps in time analysis.","Transaction dates may omit days with no sales; a calendar table contains the full date range.","A contiguous date dimension provides the complete calendar. It supports periods with no transactions and consistent year, month and quarter calculations."],["Row-level security and report performance","Advanced",18,"Published reports may need different users to see different rows. They also need to load quickly and avoid expensive model patterns.","Row-level security applies role-based DAX filters to model rows. Performance tuning examines model size, relationships, DAX queries and visual interactions.","A regional manager should see only their region's sales, while the national manager can see the whole country.","Example role filter on Region:\nRegion[RegionName] = USERPRINCIPALNAME()\n\nDesign note: map user identity to an authorised region in a security table; do not rely on a hard-coded display name.","Which statement about row-level security is correct?",["It restricts model rows for users assigned to a role","It hides only a chart title","It encrypts the PBIX file"],0,"RLS applies filters to model data. Test roles carefully and validate identity-to-region mapping before publishing.","List two checks before deploying a report with regional RLS.","Test as different users and check that the identity mapping and relationships filter the fact table.","Validate user-to-region mapping, role filters, relationship propagation, test as roles and representative users, check for unintended data leakage, and measure report performance before release."]]};
Object.keys(lessonRows).forEach(name=>{lessonRows[name].forEach(r=>{if(r[1]==="Advanced")r[1]="Intermediate"});lessonRows[name].push(...advancedModules[name]);});

const pythonCourse=[["Meet Python: give the computer one instruction","Beginner",7,"Python is a language for writing instructions. The computer follows those instructions and produces a result. You do not need to understand every symbol yet.","Python is a high-level, general-purpose programming language. A program is a sequence of instructions interpreted or compiled by the Python runtime.","Think of a recipe. The cook reads one instruction, performs it, then moves to the next. A Python program works in a similar sequence.","print(\"Hello, DataTrail!\")","What does a program contain?",["A set of instructions for a computer","A collection of photos","Only mathematical formulas"],0,"A program is a set of instructions. Python is one language used to write them.","Run one instruction that displays: I am learning Python.","Use the print function and put the words inside quotation marks.","print(\"I am learning Python\")"],["Print, comments and reading output","Beginner",8,"print() displays a value. A comment starts with # and is ignored when Python runs your program. Use comments to explain why a step exists.","print() writes representations of objects to standard output. A comment is source text beginning with # outside a string literal.","print() is the computer speaking. A comment is a small note you leave for the next person reading your recipe.","# Show the number of orders\nprint(12)\nprint(\"Orders received\")","Which line is a comment?",["print('Hello')","# this explains the code","total = 5"],1,"Text after # on a code line is a comment. Python does not execute it as an instruction.","Write a comment explaining that the next line displays monthly sales, then print 15000.","Start the comment with #. Put the display instruction on the next line.","# Display monthly sales\nprint(15000)"],["Expressions: let Python calculate","Beginner",9,"An expression is something Python can work out. It can contain numbers, operators and function calls. Python evaluates the expression before displaying the result.","An expression is syntactic code that evaluates to a value. Operator precedence determines how compound expressions are grouped.","On a calculator, you type 100 + 20 × 3 and the calculator works out the multiplication before the addition. Python follows defined precedence rules too.","print(100 + 20 * 3)\nprint((100 + 20) * 3)\nprint(100 / 4)","What does 100 + 20 * 3 evaluate to?",["360","160","120"],1,"Multiplication happens before addition, so 20 × 3 is calculated first. Parentheses can change the order.","Calculate profit from revenue 15000 and cost 8400, then print the result.","Subtract cost from revenue inside print(), or store the result first.","revenue = 15000\ncost = 8400\nprint(revenue - cost)"],["Variables: give a value a useful name","Beginner",10,"A variable is a name that refers to a value. Use = to assign a value. Choose names that explain what the value means, such as revenue or order_count.","Assignment binds a name to an object in the current namespace. Python names are case-sensitive and use dynamic typing.","A labelled jar makes it easy to find sugar later. A variable name labels a value so the program can use it again.","monthly_revenue = 12500\norder_count = 18\nprint(monthly_revenue)\nprint(order_count)","What does this line do: order_count = 18?",["Compares order_count with 18","Stores the value 18 under the name order_count","Prints 18 automatically"],1,"A single equals sign assigns a value. Assignment alone does not display anything.","Create variables called revenue and expenses, with values 18000 and 11200, then print their difference.","Assign each value on its own line. Then subtract expenses from revenue.","revenue = 18000\nexpenses = 11200\nprofit = revenue - expenses\nprint(profit)"],["Data types: numbers, text and True/False","Beginner",10,"Python values have types. Common types are int for whole numbers, float for decimal numbers, str for text and bool for True or False.","A type defines the operations supported by an object. Python is dynamically typed: names refer to objects whose types are determined at runtime.","A price is a number, a customer name is text, and a paid/unpaid flag is a yes-or-no value. Treating them as the right type prevents mistakes.","order_count = 12       # int\nunit_price = 49.50    # float\ncustomer = \"Asha\"     # str\nis_paid = True        # bool\nprint(type(unit_price))","What is the type of the value True?",["str","bool","float"],1,"True and False without quotation marks are Boolean values. 'True' with quotation marks is text.","Create one variable for a city name, one for order count and one for whether an invoice is paid. Print each type.","Use quotation marks for the city, a whole number for count and True/False for the paid flag.","city = \"Chennai\"\norder_count = 8\nis_paid = True\nprint(type(city), type(order_count), type(is_paid))"],["Numbers and arithmetic for business","Beginner",10,"Python can add, subtract, multiply and divide numbers. The // operator gives whole-number division, and % gives the remainder.","Python numeric operators include +, -, *, /, //, %, and **. Integer division and true division have different result semantics.","An analyst can calculate revenue, discount, tax, margin and average order value using arithmetic expressions.","price = 800\nquantity = 3\nsubtotal = price * quantity\ndiscount = 100\nnet_amount = subtotal - discount\nprint(net_amount)","What does 17 % 5 return?",["3","2","3.4"],1,"The % operator returns the remainder. 5 fits into 17 three times, with 2 left over.","An item costs ₹250 and 4 are sold. Calculate total sales and a 10% discount amount.","Multiply price by quantity. Multiply that subtotal by 0.10 for the discount.","price = 250\nquantity = 4\nsubtotal = price * quantity\ndiscount = subtotal * 0.10\nprint(subtotal, discount)"],["Strings and f-strings: work with text","Beginner",11,"A string stores text. Use quotation marks to create one. An f-string lets you insert variables into a sentence without manually joining pieces.","A str is an immutable sequence of Unicode code points. Formatted string literals evaluate expressions inside braces.","Imagine filling a ready-made invoice template. The fixed words stay the same, while the customer name and amount change.","customer = \"Asha\"\namount = 1250\nmessage = f\"{customer} paid ₹{amount:,}\"\nprint(message)","What character surrounds a variable inside an f-string?",["Square brackets [ ]","Curly braces { }","Angle brackets < >"],1,"An f-string starts with f before the quote, and expressions to insert are placed inside curly braces.","Create a message saying: Rahul placed 3 orders, using variables name and order_count.","Start the string with f and place the variable names inside braces.","name = \"Rahul\"\norder_count = 3\nmessage = f\"{name} placed {order_count} orders\"\nprint(message)"],["Type conversion: turn text into numbers safely","Beginner",11,"Numbers read from a file or form may arrive as text. Convert them before arithmetic. int() converts suitable text to a whole number; float() converts it to a decimal number.","Type constructors such as int(), float() and str() create values of the requested type when conversion is supported.","A spreadsheet cell that looks like 500 may still be stored as text. You cannot safely calculate with it until you convert it.","amount_text = \"500\"\namount = int(amount_text)\nprint(amount + 50)\n\nprice = float(\"49.95\")","What happens when int('500') runs?",["It creates the integer 500","It creates the text '500'","It creates 500.0 as a float"],0,"int() converts a valid whole-number string into an integer. Invalid text raises ValueError.","Convert the text '1200' into an integer named amount, then add 18% tax.","Use int() first. Calculate tax by multiplying the converted amount by 0.18.","amount_text = \"1200\"\namount = int(amount_text)\ntax = amount * 0.18\nprint(amount + tax)"],["Comparisons: ask questions about values","Beginner",9,"Comparison operators check how two values relate. They return True or False. Common operators are ==, !=, >, <, >= and <=.","Comparison expressions evaluate to Boolean values according to the operands' comparison semantics.","A business rule may ask whether an order is above ₹5,000, whether the status equals Paid, or whether a target has been met.","amount = 6200\nprint(amount >= 5000)\nprint(\"Paid\" == \"Pending\")","What does == mean in Python?",["Assign a value","Check whether two values are equal","Multiply two values"],1,"Use == to compare values. Use = to assign a value to a variable.","Create a Boolean variable called high_value that is True when amount is at least 5000.","Use the >= comparison and store its result.","amount = 6200\nhigh_value = amount >= 5000\nprint(high_value)"],["Boolean logic: combine conditions","Beginner",10,"and means both conditions must be true. or means at least one must be true. not reverses a Boolean value.","Python Boolean operators combine truth values with short-circuit evaluation. Operator precedence places not before and before or.","A discount may require a customer to be a member AND the bill to exceed a minimum. A refund may be allowed for a damaged item OR a late delivery.","is_member = True\namount = 2400\neligible = is_member and amount >= 2000\nprint(eligible)","When is A and B True?",["When both A and B are True","When either A or B is True","Only when both are False"],0,"and requires both sides to be true. or requires at least one side to be true.","Set eligible to True only if the customer is a member and the order amount is at least 2,000.","Combine the membership variable and the amount comparison with and.","is_member = True\namount = 2400\neligible = is_member and amount >= 2000"],["if, elif and else: make a decision","Beginner",11,"Use if when code should run only when a condition is true. Use elif for another possibility and else for the fallback.","Conditional statements define branching control flow. An if/elif/else chain executes the first branch whose condition evaluates to true.","A finance report might label an invoice Overdue, Due Soon or Current depending on its due date.","days_overdue = 12\nif days_overdue > 30:\n    status = \"Critical\"\nelif days_overdue > 0:\n    status = \"Overdue\"\nelse:\n    status = \"Current\"\nprint(status)","Which branch runs when days_overdue is 12 in this example?",["if","elif","else"],1,"The first condition is false, but the elif condition is true, so Python runs that branch.","Classify a score: 80 or more is High, 50–79 is Medium, and below 50 is Low.","Check the highest threshold first, then the next threshold.","if score >= 80:\n    band = \"High\"\nelif score >= 50:\n    band = \"Medium\"\nelse:\n    band = \"Low\""],["for loops: repeat an action for each item","Beginner",11,"A for loop repeats a block of code for each item in a sequence. It is useful when you have a list of orders and need to process them one by one.","A for statement iterates over an iterable, assigning each successive item to its loop target.","Instead of writing a separate total for every invoice, loop through all invoice amounts and add each one to a running total.","amounts = [1200, 900, 1500]\ntotal = 0\nfor amount in amounts:\n    total += amount\nprint(total)","What does a for loop do?",["Repeats a block for each item in an iterable","Runs only once","Automatically sorts a list"],0,"The loop body runs once for each item provided by the iterable.","Use a for loop to calculate the total of [100, 250, 80].","Start total at zero. Add each amount inside the loop.","amounts = [100, 250, 80]\ntotal = 0\nfor amount in amounts:\n    total += amount\nprint(total)"],["range, enumerate and counting positions","Beginner",11,"range() creates a sequence of integers. enumerate() gives both the position and the value while looping.","range is an immutable sequence type; enumerate yields pairs of a count and the corresponding iterable item.","When checking an invoice list, you may need the item and its row number. enumerate gives both together.","cities = [\"Chennai\", \"Pune\", \"Kochi\"]\nfor position, city in enumerate(cities, start=1):\n    print(position, city)\n\nfor number in range(1, 4):\n    print(number)","What does range(1, 4) produce?",["1, 2, 3","1, 2, 3, 4","0, 1, 2, 3"],0,"The start is included and the stop is excluded. range(1, 4) produces 1, 2 and 3.","Print each customer name with a position starting at 1.","Use enumerate(names, start=1), then print both values.","names = [\"Asha\", \"Rahul\", \"Meera\"]\nfor position, name in enumerate(names, start=1):\n    print(position, name)"],["while loops and controlling repetition","Beginner",11,"A while loop repeats as long as its condition remains true. Make sure something changes inside the loop so it can eventually stop.","A while statement repeatedly evaluates its condition and executes its suite while the condition is truthy. break and continue alter loop progression.","A stock checker could keep asking whether there are more items to process. The loop stops when the count reaches zero.","remaining = 3\nwhile remaining > 0:\n    print(\"Items left:\", remaining)\n    remaining -= 1","What prevents the example above from looping forever?",["remaining decreases on each iteration","print() closes the loop","The number 3 is special"],0,"The variable changes on every pass and eventually makes the condition false.","Use a while loop to count down from 5 to 1.","Start at 5, loop while the value is at least 1, and subtract 1 each time.","count = 5\nwhile count >= 1:\n    print(count)\n    count -= 1"],["Lists: store a sequence of values","Beginner",11,"A list stores multiple values in order. Use square brackets to create it. Positions start at zero, so the first item is at index 0.","A list is a mutable sequence type. It supports indexing, slicing, iteration and in-place modification.","Think of a row of labelled storage boxes. Each position holds one value, and you can find an item by its position.","amounts = [1200, 900, 1500]\nprint(amounts[0])\nprint(len(amounts))","Which index selects the first list item?",["0","1","-1"],0,"Python uses zero-based indexing. Index 0 selects the first element.","Create a list of three order amounts and print the second item.","Put the values in square brackets and use index 1 for the second item.","amounts = [1200, 900, 1500]\nprint(amounts[1])"],["List slices and useful list methods","Beginner",12,"A slice selects part of a list. append() adds one item, extend() adds many, and remove() removes a matching value.","Slicing uses start:stop:step with an exclusive stop index. List methods mutate or inspect the list according to their documented behaviour.","If a daily sales list contains 30 days, a slice can select the first seven days without creating a new list by hand.","days = [120, 150, 90, 200, 180]\nfirst_three = days[:3]\ndays.append(250)\nprint(first_three)\nprint(days)","What does days[:3] select?",["Indexes 0, 1 and 2","Indexes 1, 2 and 3","Every item after index 3"],0,"The stop position is exclusive. days[:3] selects indexes 0, 1 and 2.","Create a list with three expenses, append a fourth expense, then calculate the total.","Use append() before calling sum() on the list.","expenses = [100, 250, 80]\nexpenses.append(120)\nprint(sum(expenses))"],["Tuples and unpacking related values","Beginner",10,"A tuple is an ordered collection that cannot be changed after creation. Unpacking assigns its items to separate names.","A tuple is an immutable sequence. Iterable unpacking assigns successive elements to target names.","A database row might return a pair such as (city, revenue). Unpacking lets you store those two fields in meaningful variables.","record = (\"Chennai\", 12500)\ncity, revenue = record\nprint(city)\nprint(revenue)","What happens when you try to assign a new item to a tuple position?",["The tuple changes","Python raises a TypeError","Python sorts the tuple"],1,"Tuples are immutable. You can create a new tuple, but you cannot reassign an existing element.","Create a tuple containing product name and price, then unpack them into two variables.","Use two names on the left side of = and the tuple on the right.","product = (\"Notebook\", 75)\nname, price = product\nprint(name, price)"],["Dictionaries: store information with keys","Beginner",12,"A dictionary stores key-value pairs. Use a key to find its value. A key such as customer_id is clearer than remembering a position in a list.","A dict is a mutable mapping with unique hashable keys. Lookup, insertion and update operate by key rather than numeric position.","A customer record can store name, city and lifetime value under labels, so your code can ask for customer['city'].","customer = {\"name\": \"Asha\", \"city\": \"Chennai\"}\nprint(customer[\"city\"])\ncustomer[\"orders\"] = 4","What does customer['city'] access?",["The value stored under the city key","The second character in the dictionary","The dictionary's position"],0,"Dictionary access uses the key inside square brackets. The value associated with that key is returned.","Build a dictionary containing the total revenue for Chennai and Pune.","Use city names as keys and numeric totals as values.","revenue_by_city = {\"Chennai\": 2700, \"Pune\": 1200}\nprint(revenue_by_city[\"Chennai\"])"],["Sets: keep unique values","Beginner",10,"A set stores unique values. Adding a value that is already present does not create a duplicate. Sets are useful for counting unique categories.","A set is an unordered collection of distinct hashable objects supporting membership and set operations.","If 500 orders contain only four city names, a set helps you find those four unique cities.","cities = [\"Chennai\", \"Pune\", \"Chennai\", \"Kochi\"]\nunique_cities = set(cities)\nprint(unique_cities)\nprint(len(unique_cities))","What happens when you add the same value to a set twice?",["It appears twice","The set keeps only one copy","Python raises an error"],1,"Sets automatically maintain uniqueness. They do not preserve a guaranteed display order.","Find how many unique cities appear in the list ['Chennai', 'Pune', 'Chennai', 'Kochi'].","Convert the list to a set, then count its elements.","cities = [\"Chennai\", \"Pune\", \"Chennai\", \"Kochi\"]\nprint(len(set(cities)))"],["Clean and search text with string methods","Beginner",11,"Text from files may contain extra spaces or inconsistent capital letters. strip(), lower(), upper(), replace() and split() help standardise it.","String methods return transformed strings; because str is immutable, these methods do not change the original string object.","Two values such as ' Chennai ' and 'CHENNAI' may represent the same city. Clean them before grouping if the data rules support it.","raw_city = \"  CHENNAI \"\ncity = raw_city.strip().title()\nprint(city)\n\nstatus = \"paid invoice\"\nprint(status.replace(\"paid\", \"settled\"))","Do string methods such as strip() change the original string in place?",["Yes, strings are mutable","No, they return a new string","They delete the variable"],1,"Strings are immutable. Assign the returned value to a name if you want to keep the cleaned text.","Write a function-like expression that trims spaces and converts '  aShA  ' to 'Asha'.","Chain strip() and title() on the original string.","name = \"  aShA  \"\nclean_name = name.strip().title()\nprint(clean_name)"],["Functions: package a task for reuse","Beginner",12,"A function is a reusable block of code. Define it with def, give it parameters if it needs input, and use return when the caller needs the result.","A function definition creates a callable object with a local namespace. return terminates execution and passes a value to the caller.","Instead of writing the same discount calculation for every invoice, write one function and call it with different prices.","def net_amount(gross, discount):\n    return gross - discount\n\nfirst = net_amount(1000, 100)\nsecond = net_amount(2500, 250)\nprint(first, second)","What does return do?",["Displays the result on screen","Sends a value back to the caller","Repeats the function"],1,"return provides a result that the caller can store, print or use in another calculation.","Define calculate_profit(revenue, expenses) so it returns revenue minus expenses.","Use def, two parameters and one return statement.","def calculate_profit(revenue, expenses):\n    return revenue - expenses"],["Function parameters and useful defaults","Intermediate",11,"Parameters receive the values passed to a function. You can give a parameter a default value, and you can call a function using a keyword argument.","Function parameters define the binding interface. Default parameter values are evaluated when the function is defined, not each time it is called.","A discount function may use a default rate of 10%, but allow the caller to supply a different rate for a special offer.","def discounted_price(price, rate=0.10):\n    return price * (1 - rate)\n\nprint(discounted_price(1000))\nprint(discounted_price(1000, rate=0.20))","What happens when rate is omitted from discounted_price(1000)?",["The default value 0.10 is used","Python assumes 0","Python raises an error"],0,"A parameter with a default value can be omitted from the call. Its default is then used.","Write a function tax_amount(price, rate=0.18) that returns the tax amount.","Multiply price by rate; Python will use 0.18 when rate is not supplied.","def tax_amount(price, rate=0.18):\n    return price * rate"],["Scope: understand where a variable exists","Intermediate",10,"A variable created inside a function normally belongs to that function. It does not automatically become available outside it.","Python resolves names using the LEGB rule: Local, Enclosing, Global, Built-in. Local names are created in a function's local namespace.","A local variable is like a note kept inside one department's folder. Other departments cannot assume it is available unless it is returned or shared.","def calculate_total(amounts):\n    total = sum(amounts)\n    return total\n\nresult = calculate_total([100, 200])\nprint(result)","Can code outside calculate_total directly use its local name total?",["Yes, always","No, not unless the value is returned or otherwise exposed","Only when total is a number"],1,"The name total belongs to the function's local scope. The function returns its value through result.","Define a function that creates a local variable average and returns it. Store the returned value outside.","Calculate the average inside the function, then return it.","def average_order_value(amounts):\n    average = sum(amounts) / len(amounts)\n    return average\n\nresult = average_order_value([100, 200, 300])"],["Import modules from Python's standard library","Intermediate",10,"A module is a file or package containing reusable Python code. import makes its names available. Python includes useful modules such as math, statistics, csv, json and datetime.","The import statement loads a module and binds its namespace or selected names into the current module.","Importing a module is like opening a toolbox before starting a job. You do not need to build every tool yourself.","import statistics\nscores = [70, 80, 90]\nprint(statistics.mean(scores))\n\nfrom math import sqrt\nprint(sqrt(81))","What does import statistics do?",["Makes the statistics module available under its name","Installs a new operating system","Converts every number to a statistic"],0,"import loads the module so its functions can be accessed using the module name and dot notation.","Import the math module and calculate the square root of 144.","Use import math, then call math.sqrt().","import math\nprint(math.sqrt(144))"],["Understand errors and read a traceback","Intermediate",11,"Errors are information about what went wrong. A SyntaxError means Python cannot understand the code. A NameError means a name is not defined. A TypeError often means an operation received an unsuitable type.","Python exceptions report runtime or parsing failures. A traceback shows the call stack and location where an exception propagated.","A traceback is like an audit trail. Start at the last line for the error type and message, then inspect the line of code it points to.","amount = \"500\"\n# This raises TypeError because amount is text\n# print(amount + 50)\n\n# Convert first\nprint(int(amount) + 50)","What should you read first in a Python traceback?",["The error type and message, then the indicated line","Only the first line of the file","The colour of the editor"],0,"The last line usually names the exception and its message. The traceback frames identify where the problem occurred.","Correct the expression '500' + 50 so it adds the numeric values.","Convert the text to an integer before adding 50.","amount = \"500\"\nprint(int(amount) + 50)"],["Handle expected problems with try and except","Intermediate",12,"Use try and except when a problem is expected and you know how to respond. Do not hide every error silently; report what happened or return a clear fallback.","Exception handling intercepts selected exception types raised within a try suite and executes the matching except suite.","A form may contain a non-numeric amount. Instead of crashing the whole report, catch the conversion error and mark that record for review.","raw_amount = \"not available\"\ntry:\n    amount = float(raw_amount)\nexcept ValueError:\n    amount = None\n    print(\"This amount needs review\")","Which exception is normally raised by float('hello')?",["ValueError","KeyError","IndexError"],0,"ValueError means the type is acceptable for the operation, but the supplied value is not valid.","Write a safe conversion function that returns None when a value cannot be converted to float.","Put float(value) inside try and return None in except ValueError.","def safe_float(value):\n    try:\n        return float(value)\n    except ValueError:\n        return None"],["Read and write files with pathlib","Intermediate",12,"A data-analysis program often reads files and saves reports. pathlib helps build file paths, and with open() safely opens and closes a file.","Pathlib provides object-oriented filesystem paths. A file object used as a context manager is closed when the with block exits.","Treat a file like a book you borrow. Open it, read or write what you need, then close it when finished.","from pathlib import Path\n\nfile_path = Path(\"notes.txt\")\nfile_path.write_text(\"DataTrail practice\", encoding=\"utf-8\")\ntext = file_path.read_text(encoding=\"utf-8\")\nprint(text)","Why is with open(...) useful?",["It ensures the file is closed when the block ends","It turns the file into a database","It deletes the file automatically"],0,"The with statement uses a context manager to release the file resource when the block exits, even if an error occurs.","Write the text 'Python practice' to a file named practice.txt using pathlib.","Create a Path object and call write_text() with UTF-8 encoding.","from pathlib import Path\nPath(\"practice.txt\").write_text(\"Python practice\", encoding=\"utf-8\")"],["CSV files: read rows and columns","Intermediate",13,"CSV means comma-separated values. Use Python's csv module to read records. DictReader gives each row as a dictionary using the header names.","The csv module implements reading and writing of delimited tabular data. DictReader maps field names to row values.","A CSV is like a sales register saved as plain text. DictReader lets you ask for a value by column name instead of remembering its position.","import csv\nfrom io import StringIO\n\nsample = \"city,amount\\nChennai,1200\\nPune,900\"\nreader = csv.DictReader(StringIO(sample))\nfor row in reader:\n    print(row[\"city\"], row[\"amount\"])","What does csv.DictReader use as dictionary keys by default?",["The first row's header names","The row numbers","The file extension"],0,"DictReader reads the first line as field names unless fieldnames are provided separately.","Read the sample CSV and calculate the total amount for its rows.","Use DictReader with StringIO, loop through rows and convert amount to float or int before adding.","import csv\nfrom io import StringIO\nsample = \"city,amount\\nChennai,1200\\nPune,900\"\ntotal = 0\nfor row in csv.DictReader(StringIO(sample)):\n    total += float(row[\"amount\"])\nprint(total)"],["JSON: work with nested business data","Intermediate",11,"JSON stores data using objects, arrays, strings, numbers and true/false values. json.loads() converts JSON text into Python dictionaries and lists.","JSON is a text-based data-interchange format. The json module deserialises JSON documents into native Python objects.","CSV is good for flat tables. JSON is useful when one order contains nested customer details or a list of products.","import json\npayload = '{\"order_id\": 101, \"customer\": {\"name\": \"Asha\"}, \"items\": [120, 80]}'\norder = json.loads(payload)\nprint(order[\"customer\"][\"name\"])\nprint(sum(order[\"items\"]))","What Python type usually represents a JSON object?",["dict","set","tuple"],0,"JSON objects become Python dictionaries. JSON arrays become lists.","Parse a JSON message containing order_id and amount, then return the amount.","Use json.loads() and access the amount key.","import json\npayload = '{\"order_id\": 101, \"amount\": 1200}'\norder = json.loads(payload)\namount = order[\"amount\"]\nprint(amount)"],["Dates and times with datetime","Intermediate",12,"Dates should be handled as dates, not guessed from text. datetime.strptime() parses a known date format; strftime() formats a date for display or grouping.","The datetime module provides date/time classes and format-code based parsing and formatting operations.","A sales analyst may receive a date such as 19-10-2026, parse it, and group the transaction under October 2026.","from datetime import datetime\n\norder_date = datetime.strptime(\"19-10-2026\", \"%d-%m-%Y\")\nmonth = order_date.strftime(\"%Y-%m\")\nprint(month)","What does strptime() do?",["Parses text into a date/time object using a format","Prints today's date only","Sorts a list of dates"],0,"strptime parses a string using the specified format. strftime formats an existing date/time object as text.","Parse '2026-10-19' and produce the year-month text '2026-10'.","Use format '%Y-%m-%d' when parsing, then '%Y-%m' when formatting.","from datetime import datetime\ndate_value = datetime.strptime(\"2026-10-19\", \"%Y-%m-%d\")\nmonth = date_value.strftime(\"%Y-%m\")\nprint(month)"],["Comprehensions: build a list from a rule","Intermediate",11,"A list comprehension creates a new list from an iterable. It can include a condition to keep only some items. Use it when the expression is clear; use a loop when the logic needs several steps.","A list comprehension constructs a list by evaluating an expression for each item in an iterable, with optional filtering clauses.","Instead of manually collecting every paid order, describe the rule once: keep the amounts for records whose status is Paid.","amounts = [1200, 6500, 800, 7200]\nhigh_value = [amount for amount in amounts if amount >= 5000]\ndoubled = [amount * 2 for amount in amounts]","What does a list comprehension create?",["A new list","A database table","A Python module"],0,"A list comprehension returns a list of values built from an iterable and an expression.","Create a list containing only positive values from [-2, 5, 0, 8, -1].","Use `value for value in values if value > 0` inside square brackets.","values = [-2, 5, 0, 8, -1]\npositive_values = [value for value in values if value > 0]"],["Sort records using a key","Intermediate",11,"sorted() returns a new sorted list. The key argument tells Python which property to use when comparing each item. Use reverse=True for descending order.","sorted() performs a stable sort and accepts a key function that extracts a comparison key from each element.","A list of invoice dictionaries can be sorted by amount without manually rearranging the records.","orders = [{\"id\": 1, \"amount\": 1200}, {\"id\": 2, \"amount\": 5400}]\nlargest_first = sorted(orders, key=lambda order: order[\"amount\"], reverse=True)\nprint(largest_first[0][\"id\"])","What does the key function do in sorted()?",["It tells Python which value to compare for ordering","It deletes the other fields","It changes the original list automatically"],0,"The key function extracts the value used for comparison. sorted() returns a new list and leaves the input list unchanged.","Sort products from most expensive to least expensive using their price field.","Use sorted(products, key=..., reverse=True).","products = [{\"name\": \"Pen\", \"price\": 10}, {\"name\": \"Book\", \"price\": 80}]\nby_price = sorted(products, key=lambda product: product[\"price\"], reverse=True)"],["Mini project: build a reliable sales summary","Advanced",20,"Bring the skills together. Read transaction records, validate their values, calculate paid revenue, count orders and produce a city summary. A useful analyst script must be understandable and checkable—not merely produce a number.","A data-processing pipeline reads structured inputs, validates fields, transforms records, aggregates measures and produces a reproducible output with explicit assumptions.","Think of a monthly sales report as a small assembly line: receive the file, check each row, clean or reject invalid data, calculate totals, then publish a summary.","import csv\nfrom io import StringIO\n\nsample = \"city,amount,status\\nChennai,1200,Paid\\nPune,900,Pending\\nChennai,1500,Paid\"\nrows = list(csv.DictReader(StringIO(sample)))\npaid_total = sum(float(row[\"amount\"]) for row in rows if row[\"status\"] == \"Paid\")\nprint(paid_total)","What makes this more than a one-line calculation?",["It follows a repeatable read, validate, transform and summarise process","It uses the longest possible code","It never needs to be checked"],0,"A small pipeline is reliable when its assumptions are clear, invalid data is considered, and the result is tested against known cases.","Implement summarise_sales(csv_text). Return a dictionary with total_orders, paid_revenue, and revenue_by_city for Paid rows only.","Use csv.DictReader and StringIO. Validate/convert amount values. Accumulate paid revenue overall and per city, and count every input row.","def summarise_sales(csv_text):\n    import csv\n    from io import StringIO\n    total_orders = 0\n    paid_revenue = 0.0\n    revenue_by_city = {}\n    for row in csv.DictReader(StringIO(csv_text)):\n        total_orders += 1\n        if row[\"status\"] == \"Paid\":\n            amount = float(row[\"amount\"])\n            paid_revenue += amount\n            city = row[\"city\"].strip().title()\n            revenue_by_city[city] = revenue_by_city.get(city, 0) + amount\n    return {\n        \"total_orders\": total_orders,\n        \"paid_revenue\": paid_revenue,\n        \"revenue_by_city\": revenue_by_city,\n    }"]];

{title:"7 · Create a business category with CASE",lessonMatch:["case"],prompt:"Return every order and add a column called order_band. Amounts of ₹5,000 or more are Large; all others are Regular.",starter:"SELECT order_id, amount,\nCASE \nEND AS order_band\nFROM orders;",hint:"Use CASE WHEN amount >= 5000 THEN 'Large' ELSE 'Regular' END.",solution:"SELECT order_id, amount, CASE WHEN amount >= 5000 THEN 'Large' ELSE 'Regular' END AS order_band FROM orders;",check:r=>{let c=r.columns.map(x=>x.toLowerCase());if(!c.includes("order_band")||!c.includes("order_id")||r.values.length!==10)return false;let m=Object.fromEntries(r.values.map(x=>[Number(x[c.indexOf("order_id")]),x[c.indexOf("order_band")]]));return m[1005]==="Large"&&m[1001]==="Regular"&&m[1008]==="Large"}},
{title:"8 · Use a CTE for a multi-step query",lessonMatch:["cte","common table"],prompt:"Use a CTE called customer_spend to calculate total spend per customer. Return customers whose total spend exceeds ₹5,000.",starter:"WITH customer_spend AS (\n  SELECT customer_id, \n  FROM orders\n  GROUP BY customer_id\n)\nSELECT * FROM customer_spend\nWHERE ;",hint:"In the CTE, use SUM(amount) AS total_spend. In the outer query, filter total_spend > 5000.",solution:"WITH customer_spend AS (SELECT customer_id, SUM(amount) AS total_spend FROM orders GROUP BY customer_id) SELECT * FROM customer_spend WHERE total_spend > 5000;",check:r=>{let c=r.columns.map(x=>x.toLowerCase());if(!c.includes("customer_id")||!c.includes("total_spend")||r.values.length!==4)return false;return r.values.every(x=>Number(x[c.indexOf("total_spend")])>5000)}},
{title:"9 · Find customers with EXISTS",lessonMatch:["subquery","exists"],prompt:"Return customers who have at least one order above ₹5,000. Use EXISTS.",starter:"SELECT c.customer_id, c.name\nFROM customers c\nWHERE EXISTS (\n  SELECT 1 FROM orders o\n  WHERE \n);",hint:"Correlate the subquery with o.customer_id = c.customer_id and add o.amount > 5000.",solution:"SELECT c.customer_id, c.name FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id=c.customer_id AND o.amount>5000);",check:r=>{let c=r.columns.map(x=>x.toLowerCase());if(!c.includes("customer_id")||!c.includes("name")||r.values.length!==3)return false;return r.values.map(x=>Number(x[c.indexOf("customer_id")])).sort().join(",")==="2,3,4"}},

{title:"11 · Build a running total",lessonMatch:["window frame","running total","lag"],prompt:"For customer 1, return order_date, amount and cumulative spend ordered by date. Name the cumulative column running_spend.",starter:"SELECT order_date, amount,\n       SUM(amount) OVER(\n         PARTITION BY customer_id\n         ORDER BY order_date\n         ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n       ) AS running_spend\nFROM orders\nWHERE customer_id = 1\nORDER BY order_date;",hint:"The starter query is complete. Run it and inspect the cumulative values. The last running total should be 6,300.",solution:"SELECT order_date, amount, SUM(amount) OVER(PARTITION BY customer_id ORDER BY order_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_spend FROM orders WHERE customer_id=1 ORDER BY order_date;",check:r=>{let c=r.columns.map(x=>x.toLowerCase());if(!c.includes("running_spend")||r.values.length!==3)return false;return Number(r.values[r.values.length-1][c.indexOf("running_spend")])===6300}},
