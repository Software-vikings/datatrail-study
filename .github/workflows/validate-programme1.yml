name: Validate DataTrail Programme 1

on:
  push:
    branches:
      - "programme-1/**"
  pull_request:
    branches:
      - main
      - "programme-1/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: programme-1-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Programme 1 numerical and dataframe dependencies
        run: python3 -m pip install --disable-pip-version-check numpy pandas scipy matplotlib seaborn plotly openpyxl
      - name: Check Python validator syntax
        run: python3 -m py_compile scripts/validate_programme1.py scripts/verify_python_exercises.py scripts/verify_programme1_lessons.py scripts/verify_programme1_projects.py
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/datatrail-app.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/datatrail-app.js
          node --check assets/python-exercises.js
          node --check assets/python-data-analytics.js
          node --check assets/python-data-analytics-lessons.js
          node --check assets/programme1-readiness.js
          node --check scripts/validate_pages_release.js
          node scripts/validate_pages_release.js
      - name: Validate Programme 1 curriculum and semantic lesson alignment
        run: python3 scripts/validate_programme1.py
      - name: Execute released Programme 1 lesson solutions
        run: python3 scripts/verify_programme1_lessons.py
      - name: Execute the four Programme 1 portfolio projects
        run: python3 scripts/verify_programme1_projects.py
      - name: Execute every legacy Python reference solution
        run: python3 scripts/verify_python_exercises.py
