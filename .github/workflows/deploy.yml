name: Deploy DataTrail to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/datatrail-app.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/datatrail-app.js
          node --check assets/python-exercises.js
          node - <<'NODE'
          global.window = {};
          require("./assets/python-exercises.js");
          const tasks = global.window.DataTrailPythonExercises;
          if (!Array.isArray(tasks) || tasks.length !== 20) throw new Error("Expected 20 Python exercises");
          for (const [index, task] of tasks.entries()) {
            if (!task.title || !task.prompt || !task.starter || !task.solution || !Array.isArray(task.tests) || task.tests.length < 2) {
              throw new Error("Incomplete Python exercise at index " + index);
            }
            for (const test of task.tests) {
              if (!test.name || !test.code) throw new Error("Unnamed or empty test in exercise " + index);
            }
          }
          const html = require("fs").readFileSync("index.html", "utf8");
          const lessonStart = html.indexOf("const pythonCourse=") + "const pythonCourse=".length;
          const lessonEnd = html.indexOf(";\\nlessonRows.Python=", lessonStart);
          const mapStart = html.indexOf("const pythonLessonTaskMap=") + "const pythonLessonTaskMap=".length;
          const mapEnd = html.indexOf(";\\nconst tracks=", mapStart);
          if (lessonStart < 0 || lessonEnd < 0 || mapStart < 0 || mapEnd < 0) throw new Error("Python lesson syllabus or exercise map missing");
          const lessons = JSON.parse(html.slice(lessonStart, lessonEnd));
          const taskMap = JSON.parse(html.slice(mapStart, mapEnd));
          if (lessons.length !== 33 || taskMap.length !== lessons.length) throw new Error("Python lesson-to-exercise map is out of sync");
          if (taskMap.some(i => !Number.isInteger(i) || i < 0 || i >= tasks.length)) throw new Error("Invalid Python exercise mapping");
          console.log("Validated", lessons.length, "Python lessons,", tasks.length, "exercises and", tasks.reduce((n, x) => n + x.tests.length, 0), "named tests.");
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
