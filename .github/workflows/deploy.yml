name: Deploy DataTrail to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\\s\\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/datatrail-app.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/datatrail-app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
