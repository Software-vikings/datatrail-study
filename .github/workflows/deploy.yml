name: Deploy DataTrail to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install project verifier dependencies
        run: python3 -m pip install --disable-pip-version-check numpy pandas scipy matplotlib seaborn plotly openpyxl
      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/datatrail-app.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/datatrail-app.js
          node --check assets/python-exercises.js
          node --check assets/python-data-analytics.js
          node --check assets/python-data-analytics-lessons.js
          node --check assets/programme1-readiness.js
          node scripts/validate_pages_release.js
      - name: Validate Programme 1 curriculum and lesson alignment
        run: python3 scripts/validate_programme1.py
      - name: Execute all released Programme 1 lesson solutions
        run: python3 scripts/verify_programme1_lessons.py
      - name: Execute the legacy Python exercise suite
        run: python3 scripts/verify_python_exercises.py
      - name: Verify Programme 1 portfolio projects
        run: python3 scripts/verify_programme1_projects.py
      - name: Verify Python exercise reference solutions
        run: python3 scripts/verify_python_exercises.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
